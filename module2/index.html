<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION｜MODULE 02 エネルギー制御盤 v3</title>
<style>
:root{color-scheme:dark;--bg:#0a1521;--panel:#14283a;--edge:#39536a;--txt:#edf6fa;--muted:#aec3cf;--aqua:#73d6c9;--amber:#f1c476}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3d50,var(--bg) 66%);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--txt);line-height:1.65}main{max-width:980px;margin:auto;padding:24px 16px 50px}h1{margin:5px 0;font-size:clamp(1.5rem,4vw,2.4rem)}h2{font-size:1.25rem;margin:0 0 10px}h3{font-size:1.05rem;margin:15px 0 7px}p{color:var(--muted)}a{color:#a5ebe2}.eyebrow{font-size:.75rem;color:var(--aqua);letter-spacing:.14em;font-weight:800}.panel{background:rgba(19,39,56,.96);border:1px solid var(--edge);border-radius:16px;padding:20px;margin:17px 0}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.btn,button{font:inherit;color:white;background:#244b61;border:1px solid #628398;border-radius:10px;padding:11px 13px;cursor:pointer}.btn{text-decoration:none;display:inline-block}.btn:hover,button:hover{filter:brightness(1.14)}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--aqua);color:#09252b;font-weight:800;border:0}.danger{background:#663a46}.role-grid,.controls,.stats{display:grid;gap:11px}.role-grid,.stats{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:repeat(3,1fr)}.role{background:#203c51;padding:18px;border-radius:12px;border:1px solid #50718a;text-decoration:none;text-align:center}.role strong{display:block;margin:5px 0}.role small{color:#bdd0db}.stat{padding:13px;background:#203a4e;border:1px solid #426078;border-radius:12px}.stat small{display:block;color:#adc6d2}.stat strong{font-size:1.65rem}.control{min-height:125px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:#203a4d}.control b{font-size:1.06rem}.control small{color:#bfd0db}.control.used{background:#182b39;color:#8da8b8}.status{background:#203c4e;border-radius:11px;padding:12px;margin:14px 0;min-height:48px}.status.warn{background:#55313c;color:#ffe4dc}.status.ok{background:#1d5044;color:#c1ffe1}.metrics{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.chip{border:1px solid #52778b;border-radius:99px;padding:6px 12px;font-size:.85rem}.rule{background:#203a4e;border-left:3px solid #72d6c9;padding:12px 14px;margin:11px 0}.rule b{color:#fff}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #39566d;padding:10px;text-align:left;vertical-align:top}th{color:#a4d9d5}ol{padding-left:24px}li{margin:6px 0}.muted{color:var(--muted)}.foot{font-size:.8rem;color:#8ea9b9}.log{max-height:200px;overflow:auto;padding-left:25px}.tag{border:1px solid #5d8190;border-radius:99px;padding:7px 11px;font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:650px){.role-grid,.stats{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}.panel{padding:15px}main{padding:15px 10px}}
</style></head><body><main><header class="top"><div><div class="eyebrow">ORION / EMERGENCY SYSTEM</div><h1>MODULE 02｜エネルギー制御盤</h1></div><span class="tag">3人協力型・10〜12分</span></header><p>原子炉の状態は、操作の順番によって変化する。3人で専門情報を交換し、復旧計画を立てよう。</p><div id="app"></div><footer class="foot">このゲームはブラウザ内で動作します。得点は操作担当のブラウザで管理され、チーム間の自動同期・不正防止機能はありません。役割別ページはURLで分かれていますが、アクセス制限はありません。</footer></main>
<script>
'use strict';
const app=document.getElementById('app');const role=new URLSearchParams(location.search).get('role')||'start';
function link(r){let u=new URL(location.href);u.searchParams.set('role',r);return u.href}
const nav=`<nav class="nav"><a class="btn" href="${link('start')}">役割選択に戻る</a></nav>`;
const devices=[['battery','蓄電器','電力を補充'],['cool','冷却弁','冷却系を強化'],['aux','補助炉','電力を増幅'],['vent','排熱弁','炉心の熱を逃す'],['stab','温度安定器','熱の変動を抑える'],['bypass','迂回回路','非常時の電力迂回']];
function start(){app.innerHTML=`<section class="panel"><h2>担当する役割を選択</h2><p>3人が別々のページを開き、画面は共有せず声だけで情報を交換します。どちらの専門家から話し始めても構いません。</p><div class="role-grid"><a class="role" href="${link('operator')}">🖥️<strong>操作担当</strong><small>計器の値と装置の操作</small></a><a class="role" href="${link('thermal')}">🌡️<strong>熱制御技師</strong><small>温度・冷却の専門資料</small></a><a class="role" href="${link('power')}">⚡<strong>電力管理官</strong><small>電力・蓄電の専門資料</small></a></div></section><section class="panel"><h2>任務と得点</h2><p>6種類の装置は<strong>各1回だけ</strong>使えます。温度60℃以下・電力55%以上・冷却効率75%以上にし、温度安定器を作動させれば復旧成功です。すべての装置を使う必要はありません。</p><div class="rule"><b>100点スタート。</b>安全装置に拒否された操作1回につき<strong>−15点</strong>。復旧計画のやり直し1回につき<strong>−15点</strong>。最低0点。時間は同点時の順位決定に使用します。</div><p>装置を使うと温度・電力・冷却効率が変化します。<strong>ボタンはすべて押せます。</strong>操作の結果は、専門資料を使って事前に予測してください。</p><h3>役割別URL</h3>${[['operator','操作担当'],['thermal','熱制御技師'],['power','電力管理官']].map(([r,n])=>`<p><button onclick="copyLink('${r}',this)">${n}のURLをコピー</button></p>`).join('')}<p class="foot">進行役だけが開く <a href="${link('host')}">正解・ヒントページ</a></p></section>`}
function copyLink(r,el){navigator.clipboard.writeText(link(r)).then(()=>el.textContent='コピーしました').catch(()=>prompt('このURLをコピーしてください',link(r)))}
function thermal(){app.innerHTML=nav+`<section class="panel"><div class="eyebrow">THERMAL ENGINEER / PRIVATE</div><h2>熱制御技師の専門資料</h2><p>装置の状態は操作担当に聞いてください。あなたの資料だけでは復旧ルートは確定できません。</p><h3>温度・冷却に関する装置特性</h3><table><thead><tr><th>装置</th><th>温度・冷却の変化</th></tr></thead><tbody><tr><td>蓄電器</td><td>温度 <b>＋8℃</b></td></tr><tr><td>冷却弁</td><td>温度 <b>−10℃</b>。操作直前の電力が<b>55%以上なら冷却＋30%</b>、55%未満なら<b>＋15%</b></td></tr><tr><td>補助炉</td><td>操作直前の冷却が<b>75%以上なら温度＋18℃</b>、75%未満なら<b>＋28℃</b></td></tr><tr><td>排熱弁</td><td>操作直前の温度が<b>80℃以上</b>かつ冷却が<b>75%以上</b>なら<b>−18℃</b>、それ以外は<b>−8℃</b></td></tr><tr><td>温度安定器</td><td>冷却が<b>75%以上</b>かつ排熱弁が<b>すでに使用済み</b>なら<b>−12℃</b>、それ以外は<b>−5℃</b></td></tr><tr><td>迂回回路</td><td>温度<b>＋12℃</b>、冷却<b>−20%</b></td></tr></tbody></table><div class="rule">温度が<b>110℃を超える</b>操作は保護装置に拒否される。冷却効率が0%未満になる操作も拒否される。</div><p>注意：冷却弁や排熱弁は、<b>使うタイミングによって効果が変わる</b>。先に使えば有利とは限らない。</p></section>`}
function power(){app.innerHTML=nav+`<section class="panel"><div class="eyebrow">POWER OFFICER / PRIVATE</div><h2>電力管理官の専門資料</h2><p>装置の状態は操作担当に聞いてください。あなたの資料だけでは復旧ルートは確定できません。</p><h3>電力に関する装置特性</h3><table><thead><tr><th>装置</th><th>電力の変化</th></tr></thead><tbody><tr><td>蓄電器</td><td><b>＋25%</b></td></tr><tr><td>冷却弁</td><td><b>−12%</b></td></tr><tr><td>補助炉</td><td><b>＋28%</b></td></tr><tr><td>排熱弁</td><td><b>−10%</b></td></tr><tr><td>温度安定器</td><td><b>−8%</b></td></tr><tr><td>迂回回路</td><td><b>＋10%</b></td></tr></tbody></table><div class="rule">電力が<b>0%未満</b>になる操作は保護装置に拒否される。</div><p>重要：装置は各1回だけ作動できる。電力が不足した場合、同じ蓄電器をもう一度使うことはできない。</p><p>注意：電力を増やす装置にも、熱側の副作用がある可能性がある。熱制御技師に必ず確認すること。</p></section>`}
function host(){app.innerHTML=nav+`<section class="panel"><div class="eyebrow">FACILITATOR ONLY</div><h2>進行役用：解答・検証</h2><div class="rule"><b>唯一の成功ルート：蓄電器 → 冷却弁 → 補助炉 → 排熱弁 → 温度安定器。</b><br>迂回回路は使用しない。</div><table><thead><tr><th>操作</th><th>温度</th><th>電力</th><th>冷却</th></tr></thead><tbody><tr><td>初期</td><td>72℃</td><td>38%</td><td>45%</td></tr><tr><td>蓄電器</td><td>80℃</td><td>63%</td><td>45%</td></tr><tr><td>冷却弁</td><td>70℃</td><td>51%</td><td>75%</td></tr><tr><td>補助炉</td><td>88℃</td><td>79%</td><td>75%</td></tr><tr><td>排熱弁</td><td>70℃</td><td>69%</td><td>75%</td></tr><tr><td>温度安定器</td><td><b>58℃</b></td><td><b>61%</b></td><td><b>75%</b></td></tr></tbody></table><p>6装置を各0〜1回使用する全順列（安全制約内）を列挙し、目標を達成する順番が<b>1通り</b>であることを確認済み。</p><h3>なぜこの順番か</h3><ol><li>蓄電器を先に使うと、冷却弁の冷却効果が＋30%になる。</li><li>冷却弁を先に使うと、補助炉の温度上昇が＋18℃に抑えられる。</li><li>補助炉の発熱で80℃を超えた状態で排熱弁を使うと−18℃になる。</li><li>排熱弁を使ってから温度安定器を使うと−12℃になる。</li><li>迂回回路を使うと冷却効率が不足する。</li></ol><h3>ヒント</h3><p>4分：「各装置の効果は一定ですか？ 使う前の数値で効果が変わる装置を探しましょう。」</p><p>7分：「冷却弁の効率を最大にするには、先に何が必要ですか？」</p><h3>得点ルール</h3><p>100点 − 15点 ×（保護装置に拒否された操作回数＋計画をやり直した回数）。下限0点。時間は同点時の順位決定に使用。各チームの操作担当が終了画面を進行役に口頭で報告する。</p><p class="foot">注意：完全な不正防止・サーバー共有スコアではありません。ブラウザの再読込や保存データ消去を含む運用上の公平性は参加者の協力を前提とします。</p></section>`}
const initial=()=>({t:72,p:38,c:45,used:[],mistakes:0,rejections:0,resets:0,history:[],startedAt:null,finishedAt:null});
const key='orion-module02-v3';let s;
function load(){try{const o=JSON.parse(sessionStorage.getItem(key));if(o&&Number.isFinite(o.t)&&Array.isArray(o.used)&&Number.isFinite(o.mistakes))return o}catch(e){}return initial()}
function save(){sessionStorage.setItem(key,JSON.stringify(s))}
function score(){return Math.max(0,100-15*s.mistakes)}
function time(){if(s.startedAt===null)return '00:00';const seconds=Math.floor(((s.finishedAt||Date.now())-s.startedAt)/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function outcome(x,id){let n={...x,used:[...x.used,id]};switch(id){case 'battery':n.t+=8;n.p+=25;break;case 'cool':n.t-=10;n.c+=x.p>=55?30:15;n.p-=12;break;case 'aux':n.t+=x.c>=75?18:28;n.p+=28;break;case 'vent':n.t-=x.t>=80&&x.c>=75?18:8;n.p-=10;break;case 'stab':n.t-=x.c>=75&&x.used.includes('vent')?12:5;n.p-=8;break;case 'bypass':n.t+=12;n.p+=10;n.c-=20;break}return n}
function valid(x){return x.t<=110&&x.p>=0&&x.c>=0}
function won(x){return x.t<=60&&x.p>=55&&x.c>=75&&x.used.includes('stab')}
function begin(){if(s.startedAt===null){s.startedAt=Date.now();save()}}
function apply(id){if(s.finishedAt!==null||s.used.includes(id))return;begin();const name=devices.find(d=>d[0]===id)[1];const n=outcome(s,id);if(!valid(n)){s.rejections++;s.mistakes++;s.history.push(`${name}：保護装置が拒否（誤操作 −15点）`);setMessage('保護装置が操作を拒否しました。専門資料の安全限界を確認してください。','warn')}else{s.t=n.t;s.p=n.p;s.c=n.c;s.used=n.used;s.history.push(`${name}：操作完了`);setMessage(`${name}を操作しました。現在値を読み上げ、次の操作を相談してください。`,'');if(won(s)){s.finishedAt=Date.now();setMessage(`復旧成功！ 最終スコア ${score()}点 ／ 所要時間 ${time()} ／ 誤操作 ${s.mistakes}回`,'ok')}else if(s.used.length===6){setMessage('すべての装置を使用しましたが復旧条件を満たしていません。計画を見直して再起動してください。','warn')}}save();draw()}
let msg='まずは専門家と作戦を相談してください。',msgKind='';function setMessage(m,k){msg=m;msgKind=k}
function reset(){if(s.finishedAt!==null){if(!confirm('クリア記録を消して新しい挑戦を始めますか？'))return;s=initial();save();setMessage('新しい挑戦を開始しました。','');draw();return}if(s.used.length===0&&s.rejections===0){setMessage('まだ操作していません。','');draw();return}if(!confirm('装置を初期状態に戻しますか？ やり直しは誤操作1回（−15点）として記録されます。'))return;const previous=s;s=initial();s.startedAt=previous.startedAt;s.mistakes=previous.mistakes+1;s.rejections=previous.rejections;s.resets=previous.resets+1;s.history=[...previous.history,'復旧計画をやり直し（−15点）'];save();setMessage('装置を初期状態に戻しました。次の計画を相談してください。','warn');draw()}
function draw(){const done=s.finishedAt!==null;document.querySelector('#stats').innerHTML=`<div class="stat"><small>炉心温度</small><strong>${s.t}℃</strong></div><div class="stat"><small>電力出力</small><strong>${s.p}%</strong></div><div class="stat"><small>冷却効率</small><strong>${s.c}%</strong></div>`;document.querySelector('#controls').innerHTML=devices.map(([id,name,desc])=>`<button class="control ${s.used.includes(id)?'used':''}" data-id="${id}" ${s.used.includes(id)||done?'disabled':''}><b>${name}</b><small>${s.used.includes(id)?'使用済み':desc}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>apply(b.dataset.id));document.querySelector('#score').textContent=score()+'点';document.querySelector('#mistakes').textContent=s.mistakes+'回';document.querySelector('#clock').textContent=time();document.querySelector('#progress').textContent=s.used.length+'/6装置';const f=document.querySelector('#feedback');f.textContent=msg;f.className='status '+msgKind;document.querySelector('#history').innerHTML=s.history.length?s.history.map(x=>`<li>${x.replaceAll('&','&amp;').replaceAll('<','&lt;')}</li>`).join(''):'<li>操作履歴はまだありません。</li>'}
function operator(){s=load();app.innerHTML=nav+`<section class="panel"><div class="eyebrow">OPERATOR / PRIVATE</div><h2>原子炉・操作パネル</h2><p>専門資料は見えません。計器の値を2人に伝え、相談してから操作してください。装置は各1回限り使用できます。</p><div class="stats" id="stats"></div><div class="metrics"><span class="chip">得点：<b id="score"></b></span><span class="chip">誤操作：<b id="mistakes"></b></span><span class="chip">経過：<b id="clock"></b></span><span class="chip">使用済：<b id="progress"></b></span></div><div class="rule">復旧条件：温度 <b>60℃以下</b>・電力 <b>55%以上</b>・冷却効率 <b>75%以上</b>・<b>温度安定器の作動</b>。<br>100点から開始し、<b>保護装置の拒否・計画のやり直し</b>ごとに15点減点。下限0点。</div><h3>制御装置（全ボタン選択可能）</h3><div class="controls" id="controls"></div><div id="feedback" aria-live="polite" class="status"></div><div class="nav"><button class="danger" id="restart">計画をやり直す（−15点）</button><button id="fresh">全記録を消去</button></div><h3>操作履歴</h3><ol class="log" id="history"></ol><p class="foot">ブラウザの同一タブで再読み込みしても、操作履歴と減点は保持されます。参加者同士で画面は共有せず、声で状況を伝えてください。</p></section>`;document.querySelector('#restart').onclick=reset;document.querySelector('#fresh').onclick=()=>{if(!confirm('得点・誤操作・経過時間を含む全記録を削除します。進行役の許可がある場合だけ実行してください。'))return;sessionStorage.removeItem(key);s=initial();setMessage('新しい挑戦を開始しました。','');draw()};draw();setInterval(()=>{if(s.startedAt!==null)document.querySelector('#clock').textContent=time()},1000)}
if(role==='thermal')thermal();else if(role==='power')power();else if(role==='operator')operator();else if(role==='host')host();else start();
</script></body></html>
