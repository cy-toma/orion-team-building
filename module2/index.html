<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION | MODULE 02 エネルギー制御盤・スコア版</title><style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#15283a;--edge:#38546b;--txt:#edf5fa;--muted:#acc1ce;--aqua:#70d2c8;--amber:#eac57b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193b50,var(--bg) 65%);color:var(--txt);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}main{max-width:1040px;margin:auto;padding:25px 17px 65px}h1{font-size:clamp(1.65rem,4vw,2.6rem);margin:5px 0}h2{margin:0 0 14px;font-size:1.2rem}h3{font-size:1rem;margin:12px 0}.eyebrow{font-size:.78rem;letter-spacing:.17em;color:var(--aqua);font-weight:750}.sub{color:var(--muted);line-height:1.8}.panel{background:#15283aee;border:1px solid var(--edge);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 12px 40px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid #66879b;border-radius:99px;padding:7px 12px;color:#d0e5ee;font-size:.82rem}.roles,.stats,.switches{display:grid;gap:12px}.roles,.stats{grid-template-columns:repeat(3,1fr)}.switches{grid-template-columns:repeat(3,1fr)}button,.btn{font:inherit;cursor:pointer;border:1px solid #5a8499;background:#26495f;color:var(--txt);border-radius:11px;padding:11px 14px}button:hover,.btn:hover{filter:brightness(1.13)}button:disabled{opacity:.43;cursor:not-allowed}a.btn{text-decoration:none;display:inline-block}.primary{background:var(--aqua);color:#0a2730;font-weight:800;border:0}.role{padding:22px 12px;text-align:center;text-decoration:none;background:#213b50;border:1px solid #58738a;border-radius:12px;color:var(--txt)}.role b{display:block;margin:10px 0}.role small{color:var(--muted)}.nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#203a4e;border:1px solid #436279;border-radius:13px;padding:16px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{font-size:clamp(1.6rem,3vw,2.1rem)}.bar{height:8px;background:#0e1e2e;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;border-radius:10px;transition:width .25s}.switch{min-height:132px;background:#1c3448;border:1px solid #49657a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.switch strong{font-size:1rem}.switch .ico{font-size:2rem}.switch.used{background:#142a30;border-color:#417968}.switch.used:after{content:'操作済み';font-size:.72rem;color:#93d7bb}.note{border-left:3px solid var(--aqua);background:#203b4e;border-radius:3px;padding:12px 15px;line-height:1.85;margin:11px 0}.warning{border-left-color:var(--amber)}.status{padding:14px;border-radius:12px;background:#213e51;margin-top:14px;line-height:1.7}.status.bad{background:#56313b;color:#ffe0e0}.status.good{background:#174b41;color:#c6fbe1}.log{margin:0;padding-left:22px;color:#d1e0e8;line-height:1.9}.log li{border-bottom:1px solid #334d62;padding:4px 0}.mini{font-size:.85rem;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #39566b;text-align:left;padding:11px 8px}th{color:#a6dfd8}.footer{font-size:.8rem;color:#91a9b9;margin-top:28px}.ok{color:#93e7bb}.badtext{color:#ffc3b7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:660px){.roles,.stats,.switches,.grid2{grid-template-columns:1fr 1fr}.panel{padding:16px}.switch{min-height:112px}}@media(max-width:430px){.roles,.stats,.grid2{grid-template-columns:1fr}.switches{grid-template-columns:1fr 1fr}}

.switch{position:relative}.switch:disabled{opacity:.5}.switch.used:after{content:'操作済み'}
.warning-strip{background:#4b3035;border:1px solid #ab6970;border-radius:12px;padding:12px 16px;color:#ffe2d5;margin:12px 0}.danger{color:#ffb2a8}.locked{background:#5d303a;border:1px solid #bd6a73;padding:18px;border-radius:12px}.kbd{font-family:monospace;background:#213c50;border-radius:5px;padding:3px 6px}.choice{border:1px solid #4b7182;padding:12px;border-radius:10px}.rulegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.rulegrid{grid-template-columns:1fr}}
.score-pill{background:#124d46;border-color:#66cbb8;color:#d1fff1;font-size:1rem;font-weight:800}.stat .bar{height:13px;border:1px solid #47677a}.stat .fill{transition:width .3s ease}</style></head><body><main><header class="top"><div><div class="eyebrow">ORION / EMERGENCY SYSTEM</div><h1>MODULE 02｜エネルギー制御盤</h1></div><div class="pill">v2ベース · スコア版 · 3人協力</div></header><p class="sub">原子炉が暴走寸前。操作担当と2人の専門家が、別々の資料を口頭で照合しながら復旧する。<strong>誤操作1回ごとに15点減点。</strong>当てずっぽうの操作は危険だ。</p><div id="app"></div><p class="footer">無料・オフライン動作。役割別URLは技術的に閲覧制限されません。画面共有や別の役割の閲覧を避けて遊んでください。</p></main>
<script>
'use strict';
const app=document.getElementById('app'),role=new URLSearchParams(location.search).get('role')||'start';
function url(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}
const back=`<nav class="nav"><a class="btn" href="${url('start')}">← 役割選択へ</a></nav>`;
function copyRole(r,b){navigator.clipboard.writeText(url(r)).then(()=>b.textContent='コピーしました').catch(()=>prompt('URLをコピー',url(r)))}
const devices=[{id:'battery',name:'蓄電器',ico:'▣',dt:8,dp:25,dc:0},{id:'cool',name:'冷却弁',ico:'❄',dt:-10,dp:-12,dc:30},{id:'vent',name:'排熱弁',ico:'≋',dt:-18,dp:-10,dc:0},{id:'aux',name:'補助炉',ico:'◈',dt:18,dp:28,dc:0},{id:'stab',name:'温度安定器',ico:'◇',dt:-12,dp:-8,dc:0},{id:'balance',name:'循環ポンプ',ico:'◎',dt:-8,dp:-6,dc:12}];
const initial=()=>({t:72,p:38,c:45,used:[],log:[],strikes:0,started:0,finished:false,locked:false});
// There is exactly one permitted move at each reachable nonterminal state.
// Device choice is a joint application of thermal and electrical safety regulations.
function required(s){
 if(s.p<45)return 'battery';
 if(s.c<75)return 'cool';
 if(s.p<60)return 'aux';
 if(s.t>75)return 'vent';
 if(s.t>60)return 'stab';
 return null;
}
function complete(s){return s.t<=60&&s.p>=55&&s.c>=75&&s.used.length===5}
function start(){app.innerHTML=`<section class="panel"><h2>役割を選択</h2><p class="sub">操作担当・熱制御技師・電力管理官の3人で遊びます。役割に優先順位はありません。専門家は操作パネルを見ずに質問してください。</p><div class="roles"><a class="role" href="${url('operator')}"><span style="font-size:2rem">▤</span><b>操作担当</b><small>計器と操作ボタン</small></a><a class="role" href="${url('thermal')}"><span style="font-size:2rem">♨</span><b>熱制御技師</b><small>温度・冷却の規則</small></a><a class="role" href="${url('power')}"><span style="font-size:2rem">ϟ</span><b>電力管理官</b><small>電力・安全の規則</small></a></div></section><section class="panel"><h2>ミッション</h2><p class="sub">5回の正しい操作で、炉心温度60℃以下・電力55%以上・冷却効率75%以上に到達します。6つの装置のうち、1つは使用しません。誤操作1回につき15点減点されます。誤操作しても続行できますが、得点は戻りません。</p><div class="warning-strip">ボタンは使用済み以外すべて押せます。押せることは「安全」を意味しません。操作前に必ず相談してください。</div><p class="sub">画面共有・スクリーンショット送信・他の役割の資料閲覧は禁止。口頭説明・質問・メモはOKです。</p></section><section class="panel"><h2>役割別URL</h2>${[['operator','操作担当'],['thermal','熱制御技師'],['power','電力管理官']].map(([r,n])=>`<p><button onclick="copyRole('${r}',this)">${n}のURLをコピー</button></p>`).join('')}<p class="mini">進行役専用：<a style="color:#91e0d6" href="${url('host')}">正解・ヒント</a>（参加者には送らない）</p></section>`}
function operator(){let s=initial(),timer=null;
app.innerHTML=`${back}<section class="panel"><div class="eyebrow">OPERATOR / CONTROL ROOM</div><h2>原子炉制御パネル</h2><p class="sub">この画面は操作担当だけが見ます。現在の計器を口頭で伝え、専門家と安全な操作を判断してください。</p><div class="stats" id="stats"></div><div class="note warning">安定化目標：温度 <b>60℃以下</b> ／ 電力 <b>55%以上</b> ／ 冷却 <b>75%以上</b><br>ただし、数値が一時的に目標範囲に入っても、安全規則を満たす5操作が完了するまでは復旧しません。</div><div class="top"><h3>装置スイッチ</h3><span class="pill" id="strikes">誤操作 0回</span><span class="pill score-pill" id="score">スコア 100点</span></div><p class="mini">すべての未使用スイッチは操作可能です。誤操作は装置を動かさず、スコアが15点減ります。</p><div class="switches" id="switches"></div><div class="status" id="feedback" aria-live="polite">待機中。3人で相談してから開始してください。</div><nav class="nav"><button class="primary" id="startTimer">タイマー開始</button><button id="reset">新しいゲームを開始</button><span class="pill" id="clock">経過 00:00</span><span class="pill" id="count">正しい操作 0 / 5</span></nav><h3>操作ログ</h3><ol class="log" id="log"></ol></section>`;
const el=id=>document.getElementById(id);
function tick(){if(!s.started)return;const n=Math.floor((Date.now()-s.started)/1000);el('clock').textContent=`経過 ${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function begin(){if(s.started)return;s.started=Date.now();timer=setInterval(tick,1000);el('startTimer').disabled=true;tick()}
function say(t,kind=''){el('feedback').className='status '+kind;el('feedback').textContent=t}
function paint(){el('stats').innerHTML=[['炉心温度',s.t,'℃',100,'#e6a779',s.t<=60],['電力出力',s.p,'%',100,'#84b9ed',s.p>=55],['冷却効率',s.c,'%',100,'#8fddbe',s.c>=75]].map(([name,v,unit,max,color,ok])=>`<div class="stat"><span>${name}</span><strong>${v}${unit}</strong><span class="${ok?'ok':'badtext'}">${ok?'● 目標範囲':'● 要調整'}</span><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${color}"></div></div></div>`).join('');el('switches').innerHTML=devices.map(d=>`<button class="switch ${s.used.includes(d.id)?'used':''}" data-id="${d.id}" ${s.used.includes(d.id)||s.finished||s.locked?'disabled':''}><span class="ico">${d.ico}</span><strong>${d.name}</strong></button>`).join('');el('switches').querySelectorAll('button').forEach(b=>b.onclick=()=>press(b.dataset.id));el('strikes').textContent=`誤操作 ${s.strikes}回`;el('score').textContent=`スコア ${Math.max(0,100-s.strikes*15)}点`;el('count').textContent=`正しい操作 ${s.used.length} / 5`;el('log').innerHTML=s.log.length?s.log.map((x,i)=>`<li>${i+1}. ${x}</li>`).join(''):'<li>まだ操作していません。</li>'}
function press(id){if(s.finished||s.locked||s.used.includes(id))return;begin();const d=devices.find(x=>x.id===id);if(!d)return;
if(id!==required(s)){s.strikes++;const score=Math.max(0,100-s.strikes*15);s.log.push(`${d.name}：安全インターロック作動。計器は変化なし（誤操作 ${s.strikes}回／${score}点）`);say(`${d.name}：安全装置が操作を拒否しました。-15点（現在${score}点）。計器と両方の専門資料を再確認してください。`,'bad');paint();return}
const before={t:s.t,p:s.p,c:s.c};s.t+=d.dt;s.p+=d.dp;s.c+=d.dc;s.used.push(id);s.log.push(`${d.name}：温度 ${before.t}→${s.t}℃、電力 ${before.p}→${s.p}%、冷却 ${before.c}→${s.c}%`);
if(complete(s)){s.finished=true;clearInterval(timer);tick();say(`復旧成功！ 5回の正しい操作で原子炉が安定しました。${el('clock').textContent}／誤操作${s.strikes}回／スコア${Math.max(0,100-s.strikes*15)}点。`,'good')}else say(`${d.name}の操作成功。計器が変化しました。次の操作を相談してください。`);paint()}
el('startTimer').onclick=begin;el('reset').onclick=()=>{if(!confirm('新しいゲームとしてスコア・操作履歴・タイマーをすべて初期化します。競技中は押さず、進行役の許可を得てください。よろしいですか？'))return;clearInterval(timer);operator()};paint()}
function thermal(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">THERMAL ENGINEERING / RESTRICTED</div><h2>熱制御技師｜熱系統の安全規則</h2><p class="sub">あなたは炉心温度と冷却系の安全性を判断します。操作パネルは見られません。電力系の優先規則は電力管理官が持っています。</p><div class="note"><strong>熱系統の基本方針</strong><br>冷却効率が<strong>75%未満</strong>のときは、熱系統としては<strong>冷却弁</strong>を使用する。ただし、電力系統が「電力不足」を宣言している場合は、電力系統の復旧を先に行う。</div><div class="note"><strong>高温時の保護</strong><br>冷却効率が<strong>75%以上</strong>で、炉心温度が<strong>75℃を超えている</strong>なら、<strong>排熱弁</strong>を使用する。ただし、電力系統の「出力回復」が必要な場合は、その処置を優先する。</div><div class="note"><strong>仕上げの温度調整</strong><br>冷却効率が<strong>75%以上</strong>で、炉心温度が<strong>60℃超〜75℃以下</strong>なら、<strong>温度安定器</strong>を使用する。ただし、電力系統の処置が必要な場合は、そちらを優先する。</div><div class="note warning"><strong>循環ポンプの注意</strong><br>循環ポンプは試験用の装置。今回の緊急復旧手順では<strong>使用禁止</strong>。</div><h3>熱・冷却系の装置効果</h3><table><thead><tr><th>装置</th><th>温度</th><th>冷却効率</th></tr></thead><tbody><tr><td>蓄電器</td><td>+8℃</td><td>変化なし</td></tr><tr><td>冷却弁</td><td>−10℃</td><td>+30%</td></tr><tr><td>排熱弁</td><td>−18℃</td><td>変化なし</td></tr><tr><td>補助炉</td><td>+18℃</td><td>変化なし</td></tr><tr><td>温度安定器</td><td>−12℃</td><td>変化なし</td></tr><tr><td>循環ポンプ</td><td>−8℃</td><td>+12%</td></tr></tbody></table><p class="mini">※熱系統だけで次の操作を確定してはいけません。電力管理官の判断を聞いてください。</p></section>`}
function power(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">POWER ENGINEERING / RESTRICTED</div><h2>電力管理官｜電力系統の安全規則</h2><p class="sub">あなたは電力出力と、電力復旧処置の優先順位を判断します。操作パネルは見られません。熱系統の基準は熱制御技師が持っています。</p><div class="note"><strong>電力不足（最優先）</strong><br>電力出力が<strong>45%未満</strong>なら、ほかの装置より先に<strong>蓄電器</strong>を使用する。</div><div class="note"><strong>出力回復（冷却確保後）</strong><br>電力出力が<strong>45%以上〜60%未満</strong>で、冷却効率が<strong>75%以上</strong>なら、熱系統の処置より先に<strong>補助炉</strong>を使用する。</div><div class="note"><strong>電力系統が優先しない場合</strong><br>上記のどちらにも該当しなければ、次の操作は熱制御技師の判断に委ねる。</div><div class="note warning"><strong>重要</strong><br>補助炉は温度を大きく上げる。温度が高くても、出力回復が必要な状態では補助炉を先に使用する規則となっている。熱制御技師と数値を確認すること。</div><h3>電力系の装置効果</h3><table><thead><tr><th>装置</th><th>電力出力</th></tr></thead><tbody><tr><td>蓄電器</td><td>+25%</td></tr><tr><td>冷却弁</td><td>−12%</td></tr><tr><td>排熱弁</td><td>−10%</td></tr><tr><td>補助炉</td><td>+28%</td></tr><tr><td>温度安定器</td><td>−8%</td></tr><tr><td>循環ポンプ</td><td>−6%</td></tr></tbody></table><p class="mini">※熱系統の基準は分かりません。熱制御技師と状況を突き合わせてください。</p></section>`}
function host(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">FACILITATOR ONLY</div><h2>進行役専用｜唯一の正解ルート</h2><p class="sub">今回のルールでは各状態で安全な操作は1つだけです。未使用ボタンはすべて押せますが、誤操作ごとに15点減点されます。ゲームオーバーにはならず、操作を続けられます。</p><table><thead><tr><th>操作</th><th>温度</th><th>電力</th><th>冷却</th><th>根拠</th></tr></thead><tbody><tr><td>初期</td><td>72</td><td>38</td><td>45</td><td>電力不足</td></tr><tr><td>1. 蓄電器</td><td>80</td><td>63</td><td>45</td><td>電力38% &lt;45%</td></tr><tr><td>2. 冷却弁</td><td>70</td><td>51</td><td>75</td><td>冷却45% &lt;75%</td></tr><tr><td>3. 補助炉</td><td>88</td><td>79</td><td>75</td><td>電力51% &lt;60%、冷却75%</td></tr><tr><td>4. 排熱弁</td><td>70</td><td>69</td><td>75</td><td>温度88℃ &gt;75℃</td></tr><tr><td>5. 温度安定器</td><td>58</td><td>61</td><td>75</td><td>温度70℃ &gt;60℃</td></tr></tbody></table><div class="note"><strong>唯一の成功順：</strong>蓄電器 → 冷却弁 → 補助炉 → 排熱弁 → 温度安定器。<br>循環ポンプは使いません。最終状態は58℃ / 61% / 75%。</div><h3>ヒント</h3><p class="sub"><strong>4分：</strong>「電力管理官に、他の処置より優先する条件があるか聞いてみてください」<br><strong>7分：</strong>「操作後の数値が変わるたびに、電力系統の優先条件を再確認しましょう」<br><strong>10分：</strong>「冷却を75%にした後、電力が60%未満なら、温度より先に電力の処置が必要です」</p><h3>検証ポイント</h3><p class="sub">1人が手順を読み上げるだけで解けないか／操作担当が数値を伝えているか／熱と電力の優先順位を2人で確認しているか／誤操作の減点が緊張感として適切か。</p></section>`}
if(role==='operator')operator();else if(role==='thermal')thermal();else if(role==='power')power();else if(role==='host')host();else start();
</script></body></html>
