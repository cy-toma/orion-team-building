<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION | MODULE 02 エネルギー制御盤</title>
<style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#15283a;--edge:#38546b;--txt:#edf5fa;--muted:#acc1ce;--aqua:#70d2c8;--amber:#eac57b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193b50,var(--bg) 65%);color:var(--txt);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}main{max-width:1040px;margin:auto;padding:25px 17px 65px}h1{font-size:clamp(1.65rem,4vw,2.6rem);margin:5px 0}h2{margin:0 0 14px;font-size:1.2rem}h3{font-size:1rem;margin:12px 0}.eyebrow{font-size:.78rem;letter-spacing:.17em;color:var(--aqua);font-weight:750}.sub{color:var(--muted);line-height:1.8}.panel{background:#15283aee;border:1px solid var(--edge);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 12px 40px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid #66879b;border-radius:99px;padding:7px 12px;color:#d0e5ee;font-size:.82rem}.roles,.stats,.switches{display:grid;gap:12px}.roles,.stats{grid-template-columns:repeat(3,1fr)}.switches{grid-template-columns:repeat(3,1fr)}button,.btn{font:inherit;cursor:pointer;border:1px solid #5a8499;background:#26495f;color:var(--txt);border-radius:11px;padding:11px 14px}button:hover,.btn:hover{filter:brightness(1.13)}button:disabled{opacity:.43;cursor:not-allowed}a.btn{text-decoration:none;display:inline-block}.primary{background:var(--aqua);color:#0a2730;font-weight:800;border:0}.role{padding:22px 12px;text-align:center;text-decoration:none;background:#213b50;border:1px solid #58738a;border-radius:12px;color:var(--txt)}.role b{display:block;margin:10px 0}.role small{color:var(--muted)}.nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#203a4e;border:1px solid #436279;border-radius:13px;padding:16px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{font-size:clamp(1.6rem,3vw,2.1rem)}.bar{height:8px;background:#0e1e2e;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;border-radius:10px;transition:width .25s}.switch{min-height:132px;background:#1c3448;border:1px solid #49657a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.switch strong{font-size:1rem}.switch .ico{font-size:2rem}.switch.used{background:#142a30;border-color:#417968}.switch.used:after{content:'操作済み';font-size:.72rem;color:#93d7bb}.note{border-left:3px solid var(--aqua);background:#203b4e;border-radius:3px;padding:12px 15px;line-height:1.85;margin:11px 0}.warning{border-left-color:var(--amber)}.status{padding:14px;border-radius:12px;background:#213e51;margin-top:14px;line-height:1.7}.status.bad{background:#56313b;color:#ffe0e0}.status.good{background:#174b41;color:#c6fbe1}.log{margin:0;padding-left:22px;color:#d1e0e8;line-height:1.9}.log li{border-bottom:1px solid #334d62;padding:4px 0}.mini{font-size:.85rem;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #39566b;text-align:left;padding:11px 8px}th{color:#a6dfd8}.footer{font-size:.8rem;color:#91a9b9;margin-top:28px}.ok{color:#93e7bb}.badtext{color:#ffc3b7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:660px){.roles,.stats,.switches,.grid2{grid-template-columns:1fr 1fr}.panel{padding:16px}.switch{min-height:112px}}@media(max-width:430px){.roles,.stats,.grid2{grid-template-columns:1fr}.switches{grid-template-columns:1fr 1fr}}
</style></head><body><main><header class="top"><div><div class="eyebrow">ORION / EMERGENCY SYSTEM</div><h1>MODULE 02｜エネルギー制御盤</h1></div><div class="pill">3人協力型 · 10〜12分</div></header><p class="sub">通信は復旧した。しかし原子炉の出力が不安定だ。専門資料を持つ2人と、装置を操作する1人が、声だけで協力して安定状態へ導こう。</p><div id="app"></div><div class="footer">このゲームはブラウザ内だけで動作し、サーバーへの状態送信やユーザー登録はありません。役割別URLにアクセス制限はないため、資料を見せないルールで遊んでください。</div></main>
<script>
'use strict';
const app=document.getElementById('app');const q=new URLSearchParams(location.search);const role=q.get('role')||'start';
function url(r){let u=new URL(location.href);u.searchParams.set('role',r);return u.href}
const back=`<nav class="nav"><a class="btn" href="${url('start')}">← 役割選択へ</a></nav>`;
function copyRole(r,button){navigator.clipboard.writeText(url(r)).then(()=>button.textContent='コピーしました').catch(()=>prompt('URLをコピーしてください',url(r)))}
const actions=[
{id:'battery',name:'蓄電器',ico:'▣',dt:8,dp:25,dc:0,check:()=>true},
{id:'cool',name:'冷却弁',ico:'❄',dt:-10,dp:-12,dc:30,check:s=>s.p>=45},
{id:'vent',name:'排熱弁',ico:'≋',dt:-18,dp:-10,dc:0,check:s=>s.c>=65},
{id:'aux',name:'補助炉',ico:'◈',dt:18,dp:28,dc:0,check:s=>s.c>=65},
{id:'stab',name:'温度安定器',ico:'◇',dt:-12,dp:-8,dc:0,check:s=>s.p>=55},
{id:'balance',name:'循環ポンプ',ico:'◎',dt:-8,dp:-6,dc:12,check:s=>s.p>=45}
];
const initial={t:72,p:38,c:45,used:[],history:[],started:null,finished:false,attempts:0};
function start(){app.innerHTML=`<section class="panel"><h2>担当する役割を選択</h2><p class="sub">各自が自分の役割の画面だけを開き、口頭で情報を共有してください。役割に順番はありません。</p><div class="roles"><a class="role" href="${url('operator')}"><span style="font-size:2rem">▤</span><b>操作担当</b><small>計器とスイッチを操作</small></a><a class="role" href="${url('thermal')}"><span style="font-size:2rem">♨</span><b>熱制御技師</b><small>温度・冷却系の資料</small></a><a class="role" href="${url('power')}"><span style="font-size:2rem">ϟ</span><b>電力管理官</b><small>電力・起動条件の資料</small></a></div></section><section class="panel"><h2>ミッション</h2><p class="sub">スイッチを操作すると、温度・電力・冷却効率が変わります。3つの計器を同時に安全範囲へ収めれば成功です。各スイッチは1回だけ使用可能。使用条件を満たさない操作は拒否され、計器は変化しません。</p><div class="note">画面共有・スクリーンショット送信・他の役割の資料閲覧は禁止。口頭での説明、質問、メモ、相談はOKです。</div><p class="sub">操作担当は「タイマー開始」を押してください。困った場合は「1手戻す」でやり直せます。</p></section><section class="panel"><h2>役割別URLを配布</h2>${[['operator','操作担当'],['thermal','熱制御技師'],['power','電力管理官']].map(([r,n])=>`<p><button onclick="copyRole('${r}',this)">${n}のURLをコピー</button></p>`).join('')}<p class="mini">進行役専用：<a style="color:#91e0d6" href="${url('host')}">解答・ヒントを見る</a>（参加者には送らない）</p></section>`}
function operator(){let state=structuredClone(initial),interval=null;
app.innerHTML=`${back}<section class="panel"><div class="eyebrow">OPERATOR / CONTROL ROOM</div><h2>原子炉の状態</h2><p class="sub">操作担当だけがこの画面を見ます。専門資料はありません。計器の値や操作結果を口頭で伝えてください。</p><div class="stats" id="stats"></div><div class="note warning">安定化条件：<strong>炉心温度 60℃以下</strong>、<strong>電力出力 55%以上</strong>、<strong>冷却効率 75%以上</strong>。3つを同時に満たしてください。</div><h3>制御スイッチ</h3><p class="mini">スイッチの効果と使用条件は専門家に聞いてください。各スイッチは1回のみ使用可能です。</p><div class="switches" id="switches"></div><div class="status" id="feedback" aria-live="polite">待機中。3人で状況を確認してから開始してください。</div><nav class="nav"><button class="primary" id="startTimer">タイマー開始</button><button id="undo">1手戻す</button><button id="reset">最初から</button><span class="pill" id="clock">経過 00:00</span><span class="pill" id="count">操作 0回</span></nav><h3>操作ログ</h3><ol class="log" id="log"><li>まだ操作していません。</li></ol></section>`;
const el=id=>document.getElementById(id);function time(){if(!state.started)return;let n=Math.floor((Date.now()-state.started)/1000);el('clock').textContent=`経過 ${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function begin(){if(state.started)return;state.started=Date.now();interval=setInterval(time,1000);el('startTimer').disabled=true;time()}
function message(s,cls=''){el('feedback').className='status '+cls;el('feedback').textContent=s}
function paint(){el('stats').innerHTML=[['炉心温度',state.t,'℃',100,'#e6a779',state.t<=60],['電力出力',state.p,'%',100,'#84b9ed',state.p>=55],['冷却効率',state.c,'%',100,'#8fddbe',state.c>=75]].map(([n,v,u,max,color,ok])=>`<div class="stat"><span>${n}</span><strong>${v}${u}</strong><span class="${ok?'ok':'badtext'}">${ok?'● 安全範囲':'● 要調整'}</span><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${color}"></div></div></div>`).join('');el('switches').innerHTML=actions.map(a=>`<button class="switch ${state.used.includes(a.id)?'used':''}" data-id="${a.id}" ${state.used.includes(a.id)||state.finished?'disabled':''}><span class="ico">${a.ico}</span><strong>${a.name}</strong></button>`).join('');el('switches').querySelectorAll('button').forEach(b=>b.onclick=()=>press(b.dataset.id));el('undo').disabled=!state.history.length||state.finished;el('count').textContent=`操作 ${state.used.length}回`;el('log').innerHTML=state.history.length?state.history.map((h,i)=>`<li>${i+1}. ${h.name}：温度 ${h.before.t}→${h.after.t}℃ ／ 電力 ${h.before.p}→${h.after.p}% ／ 冷却 ${h.before.c}→${h.after.c}%</li>`).join(''):'<li>まだ操作していません。</li>'}
function press(id){if(state.finished)return;begin();const a=actions.find(x=>x.id===id);if(!a||state.used.includes(id))return;if(!a.check(state)){message(`${a.name}は現在の状態では作動しません。使用条件を専門家に確認してください。`,'bad');return}const before={t:state.t,p:state.p,c:state.c};state.t+=a.dt;state.p+=a.dp;state.c+=a.dc;state.used.push(id);state.history.push({id,name:a.name,before,after:{t:state.t,p:state.p,c:state.c}});if(state.t<=60&&state.p>=55&&state.c>=75){state.finished=true;clearInterval(interval);time();message(`復旧成功！ 原子炉が安定しました。${el('clock').textContent}、${state.used.length}回の操作でクリア。`,'good')}else{message(`${a.name}を作動させました。計器の変化を2人に報告してください。`)}paint()}
el('startTimer').onclick=begin;el('undo').onclick=()=>{if(!state.history.length||state.finished)return;const h=state.history.pop();state.t=h.before.t;state.p=h.before.p;state.c=h.before.c;state.used.pop();message(`${h.name}の操作を取り消しました。現在の状態から再検討できます。`);paint()};el('reset').onclick=()=>{if(!confirm('計器・操作履歴・タイマーを初期状態に戻しますか？'))return;clearInterval(interval);operator()};paint()}
function thermal(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">THERMAL ENGINEERING / RESTRICTED</div><h2>熱制御技師の専門資料</h2><p class="sub">操作画面は見えません。装置の温度と冷却効率を操作担当に聞き、必要な操作を相談してください。ここには<strong>温度・冷却効率への影響</strong>と、熱系統の起動条件だけが記載されています。</p><table><thead><tr><th>装置</th><th>炉心温度</th><th>冷却効率</th></tr></thead><tbody><tr><td>蓄電器</td><td>+8℃</td><td>変化なし</td></tr><tr><td>冷却弁</td><td>−10℃</td><td>+30%</td></tr><tr><td>排熱弁</td><td>−18℃</td><td>変化なし</td></tr><tr><td>補助炉</td><td>+18℃</td><td>変化なし</td></tr><tr><td>温度安定器</td><td>−12℃</td><td>変化なし</td></tr><tr><td>循環ポンプ</td><td>−8℃</td><td>+12%</td></tr></tbody></table><div class="note"><strong>熱系統の起動制限</strong><br>・排熱弁は、冷却効率が<strong>65%以上</strong>でないと作動しない。<br>・補助炉も、冷却効率が<strong>65%以上</strong>でないと作動しない。</div><div class="note warning"><strong>設計上の注意</strong><br>冷却効率が上がっても、それだけでは炉心温度は安全とは限らない。補助炉の起動は温度を大きく上げるため、ほかの操作との組み合わせを確認すること。</div><p class="mini">電力への影響や、電力による起動制限は電力管理官の専門資料に記載されています。</p></section>`}
function power(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">POWER ENGINEERING / RESTRICTED</div><h2>電力管理官の専門資料</h2><p class="sub">操作画面は見えません。装置の電力出力を操作担当に聞き、必要な操作を相談してください。ここには<strong>電力への影響</strong>と、電力系統の起動条件だけが記載されています。</p><table><thead><tr><th>装置</th><th>電力出力</th></tr></thead><tbody><tr><td>蓄電器</td><td>+25%</td></tr><tr><td>冷却弁</td><td>−12%</td></tr><tr><td>排熱弁</td><td>−10%</td></tr><tr><td>補助炉</td><td>+28%</td></tr><tr><td>温度安定器</td><td>−8%</td></tr><tr><td>循環ポンプ</td><td>−6%</td></tr></tbody></table><div class="note"><strong>電力系統の起動制限</strong><br>・冷却弁は、操作前の電力出力が<strong>45%以上</strong>でないと作動しない。<br>・温度安定器は、操作前の電力出力が<strong>55%以上</strong>でないと作動しない。<br>・循環ポンプは、操作前の電力出力が<strong>45%以上</strong>でないと作動しない。</div><div class="note warning"><strong>設計上の注意</strong><br>蓄電器だけで電力出力を確保できるとは限らない。冷却装置や排熱装置も電力を消費する。どの時点で補助炉を起動できるか、熱制御技師に確認すること。</div><p class="mini">温度・冷却効率への影響や、冷却効率による起動制限は熱制御技師の専門資料に記載されています。</p></section>`}
function host(){app.innerHTML=`${back}<section class="panel"><div class="eyebrow">FACILITATOR ONLY</div><h2>進行役用：正解・検証済みルート</h2><p class="sub">参加者にこの画面を見せないでください。安定化条件は温度60℃以下、電力55%以上、冷却効率75%以上です。</p><table><thead><tr><th>操作</th><th>温度</th><th>電力</th><th>冷却</th></tr></thead><tbody><tr><td>初期状態</td><td>72℃</td><td>38%</td><td>45%</td></tr><tr><td>蓄電器</td><td>80℃</td><td>63%</td><td>45%</td></tr><tr><td>冷却弁</td><td>70℃</td><td>51%</td><td>75%</td></tr><tr><td>排熱弁</td><td>52℃</td><td>41%</td><td>75%</td></tr><tr><td>補助炉</td><td>70℃</td><td>69%</td><td>75%</td></tr><tr><td>温度安定器</td><td>58℃</td><td>61%</td><td>75%</td></tr></tbody></table><div class="note"><strong>5手で成功する一例：</strong>蓄電器 → 冷却弁 → 排熱弁 → 補助炉 → 温度安定器。<br>別の正解順序もあります。判定は順序固定ではなく、最終状態が安全範囲に入ったかで行います。</div><h3>ヒント</h3><p class="sub"><strong>4分経過：</strong>「最初に動かせる装置と、電力の不足を補える装置を確認しましょう」<br><strong>7分経過：</strong>「冷却効率を上げると動かせる装置が増えます。熱と電力の両方の資料を確認してください」<br><strong>10分経過：</strong>「蓄電器 → 冷却弁まで試してみてください。その後の温度と電力を相談しましょう」</p><h3>運営メモ</h3><p class="sub">誤操作による即ゲームオーバーはありません。「1手戻す」で何度でも相談し直せます。3人が役割の情報を共有し、状態変化を報告することを重視してください。全6装置の使用は必須ではありません。</p></section>`}
if(role==='operator')operator();else if(role==='thermal')thermal();else if(role==='power')power();else if(role==='host')host();else start();
</script></body></html>
