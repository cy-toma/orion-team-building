<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION | 航行システムの復旧 v2</title><style>
:root{color-scheme:dark;--bg:#091522;--panel:#172c40;--line:#39566d;--txt:#eef8fc;--sub:#b5c9d6;--aqua:#7ce4d3;--red:#ffb6b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a3b51,var(--bg) 75%);font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:var(--txt)}main{max-width:1020px;margin:auto;padding:26px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:7px 0}h2{font-size:1.18rem;margin:0 0 13px}h3{font-size:1rem;margin:17px 0 8px}p,li{color:var(--sub);line-height:1.75}.eyebrow{font-size:.77rem;letter-spacing:.16em;color:var(--aqua);font-weight:800}.card{background:#172b3ded;border:1px solid var(--line);border-radius:17px;padding:21px;margin:17px 0}.top,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nav{justify-content:flex-start;margin:14px 0}.pill{border:1px solid #5c8292;border-radius:30px;padding:7px 12px;font-size:.82rem}.roles,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{display:block;text-decoration:none;text-align:center;padding:22px 10px;background:#203b50;border:1px solid #56798d;border-radius:12px;color:var(--txt)}.role b{display:block;margin:9px 0}.role small,.muted{color:var(--sub)}button,.btn,select{font:inherit;background:#284c62;border:1px solid #648b9a;border-radius:10px;color:white;padding:11px 15px;cursor:pointer;text-decoration:none}button:hover:not(:disabled),.btn:hover{filter:brightness(1.17)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#7ad8cb;color:#08212a;font-weight:800;border:0}.stat{background:#203b50;border:1px solid #496b80;border-radius:12px;padding:13px}.stat small{color:var(--sub)}.stat strong{display:block;font-size:1.65rem;margin-top:5px}.map{background:#0e2032;border:1px solid #385a70;border-radius:15px;overflow:hidden}.map svg{display:block;width:100%;height:auto;max-height:430px}.edge{stroke:#6c91a8;stroke-width:3;stroke-dasharray:6 5;opacity:.8}.edge.active{stroke:#7ee4ce;stroke-width:5;stroke-dasharray:none;opacity:1}.node circle{fill:#26465c;stroke:#86afc2;stroke-width:2}.node text{fill:#eff9ff;font-size:15px;font-weight:800;pointer-events:none}.node{cursor:pointer}.node:focus{outline:none}.node:focus circle{stroke:#fff;stroke-width:4}.node.chosen circle{fill:#286b67;stroke:#9affdf;stroke-width:3}.node.next circle{stroke:#ffda87;stroke-width:3}.node.locked{cursor:default;opacity:.7}.hint{background:#213b50;border-left:4px solid var(--aqua);padding:12px 14px;border-radius:6px;line-height:1.8;margin:12px 0}.warn{border-left-color:#e9b16f}.bad{background:#553039;color:#ffe0dc}.good{background:#205344;color:#d7ffeb}.status{padding:14px;border-radius:11px;background:#203b50;line-height:1.7;margin-top:13px}.route{font-weight:750;color:#a5f1de;min-height:28px;line-height:2}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #39566b;text-align:left}th{color:#9ae5d7}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:.85rem;color:var(--sub)}.footer{margin-top:24px;font-size:.82rem;color:#9bb4c4}a{color:#9beadd}.tag{display:inline-block;border:1px solid #567b8e;border-radius:7px;padding:2px 7px;font-size:.79rem}.section{background:#10273a;border-radius:12px;padding:15px;margin:12px 0}.accent{color:#8ce9d8}.warning{color:#ffd19d}label{color:#d8ebf4}.mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mode select{min-width:160px}@media(max-width:650px){.roles,.stats,.two{grid-template-columns:1fr}.card{padding:16px}.map svg{max-height:none}}
</style></head><body><main><div class="top"><div><div class="eyebrow">ORION / MODULE 03</div><h1>航行システムの復旧</h1><p style="margin:0">航行モードを使い分け、危険宙域を突破せよ。</p></div><span class="pill">3人協力・最終ミッション</span></div><div id="app"></div><p class="footer">役割別資料は自分の画面だけで確認してください。口頭での情報共有・質問・メモは自由です。</p></main><script>
'use strict';
const app=document.getElementById('app'),role=new URLSearchParams(location.search).get('role')||'start';
const EDGES=[['S','A',3,'clear'],['S','B',2,'clear'],['A','C',3,'clear'],['A','D',2,'blocked'],['B','D',2,'clear'],['B','E',3,'clear'],['C','F',3,'shield'],['C','D',2,'blocked'],['D','F',3,'shield'],['D','G',2,'shield'],['E','G',3,'clear'],['E','D',2,'blocked'],['F','T',3,'normal'],['G','T',3,'normal'],['F','G',2,'shield']];
const POINTS={S:[42,177],A:[154,66],B:[154,292],C:[280,54],D:[280,177],E:[280,304],F:[408,82],G:[408,270],T:[530,177]};
const STORAGE='orion-module03-v2';
function url(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}
function fmt(ms){const sec=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function penalty(ms){return Math.max(0,Math.floor((ms-120000)/30000))*2}
function initial(){return {started:null,ended:null,route:['S'],modes:[],errors:0,done:false,notice:'「タイマー開始」を押すと航路と航行モードを選択できます。',noticeType:'',history:[]}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.route)&&Array.isArray(s.modes)&&s.route[0]==='S'&&s.modes.length===s.route.length-1&&typeof s.errors==='number')return s}catch(e){}return initial()}
function save(s){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}}
function elapsed(s){return s.started?(s.ended||Date.now())-s.started:0}
function score(s){return Math.max(0,100-s.errors*15-penalty(elapsed(s)))}
function edge(a,b){return EDGES.find(e=>e[0]===a&&e[1]===b)}
function evaluate(route,modes){let fuel=0,unsafe=[];for(let i=0;i<modes.length;i++){let e=edge(route[i],route[i+1]);if(!e)return {fuel:Infinity,unsafe:['invalid']};let [a,b,base,hazard]=e,m=modes[i];fuel+=base+(m==='P'?2:0);if(hazard==='blocked'||hazard==='shield'&&m!=='P'||hazard==='normal'&&m!=='N')unsafe.push(a+'→'+b);if(a==='D'&&b==='G'&&m==='P'&&i>0&&route[i-1]==='B'&&route[i]==='D'&&modes[i-1]==='N')fuel-=2}return {fuel,unsafe}}
function mapSvg(route,enabled){let segs=EDGES.map(([a,b])=>{let p=POINTS[a],q=POINTS[b],active=route.some((n,i)=>n===a&&route[i+1]===b);return `<line class="edge ${active?'active':''}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"></line>`}).join('');let nodes=Object.entries(POINTS).map(([id,p])=>{let chosen=route.includes(id),next=enabled&&!!edge(route[route.length-1],id)&&!chosen;return `<g class="node ${chosen?'chosen':''} ${next?'next':''} ${!enabled?'locked':''}" data-node="${id}" role="button" tabindex="${next?0:-1}" aria-label="地点${id}${next?'へ追加可能':''}"><circle cx="${p[0]}" cy="${p[1]}" r="20"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle">${id==='T'?'★':id}</text></g>`}).join('');return `<div class="map"><svg viewBox="0 0 575 355" role="img" aria-label="航路マップ。Sが出発点、星印が目的地。線は左から右に進む接続を表す。">${segs}${nodes}</svg></div>`}
function header(name){return `<div class="nav"><a class="btn" href="${url('start')}">役割選択へ</a><span class="pill">${name}</span></div>`}
function start(){app.innerHTML=`<section class="card"><h2>担当する役割を選択</h2><p>3人が異なる情報を持っています。航行担当は航路、観測担当は宙域の特性、機関担当は燃料とエンジンの特性を知っています。</p><div class="roles"><a class="role" href="${url('operator')}"><span style="font-size:2rem">🧭</span><b>航行担当</b><small>航路・航行モードの選択と実行</small></a><a class="role" href="${url('observer')}"><span style="font-size:2rem">📡</span><b>観測担当</b><small>宙域の特性と安全条件</small></a><a class="role" href="${url('engineer')}"><span style="font-size:2rem">⚙️</span><b>機関担当</b><small>燃料・エンジンの特性</small></a></div></section><section class="card"><h2>ミッション</h2><p>Sから帰還ゲート★まで、<b>安全かつ燃料10ユニット以下</b>で到達してください。区間ごとに<b>通常航行</b>または<b>防護航行</b>を選択します。モードによって安全性と燃料が変わります。</p><div class="hint">航路を考えている間は自由に修正できます。「航行実行」で計画を確定し、失敗すると<b>−15点</b>。開始2分30秒から30秒ごとに<b>−2点</b>です。</div></section><section class="card"><h2>役割別URL</h2>${[['operator','航行担当'],['observer','観測担当'],['engineer','機関担当']].map(([r,n])=>`<p><button data-copy="${r}">${n}のURLをコピー</button></p>`).join('')}<p class="small">進行役専用：<a href="${url('host')}">正解・ヒント画面</a>（参加者には送らない）</p></section>`;app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(url(b.dataset.copy));b.textContent='コピーしました'}catch(e){prompt('このURLをコピーしてください',url(b.dataset.copy))}})}
function observer(){app.innerHTML=header('観測担当')+`<section class="card"><h2>📡 観測レポート｜宙域の安全</h2><p>航行マップと燃料消費量は分かりません。航行担当に経路を確認し、区間ごとの危険特性を伝えてください。</p><div class="section"><h3>航行モードと安全性</h3><p><span class="tag">通常航行 N</span> シールドを展開しない。通常宙域では安全だが、<b>荷電粒子帯</b>では危険。</p><p><span class="tag">防護航行 P</span> シールドを展開する。荷電粒子帯を安全に通れる。ただし<b>帰還ゲート付近はシールド展開禁止</b>。</p></div><h3>観測された宙域</h3><table><thead><tr><th>区間</th><th>観測結果</th></tr></thead><tbody><tr><td>A→D / C→D / E→D</td><td>崩壊デブリ帯。<b>どちらのモードでも通行不可</b></td></tr><tr><td>C→F / D→F / F→G</td><td>荷電粒子帯。<b>防護航行なら通過可能</b></td></tr><tr><td>D→G</td><td>強いイオン嵐。<b>防護航行が必須</b></td></tr><tr><td>F→★ / G→★</td><td>ゲート干渉域。<b>通常航行のみ安全</b></td></tr><tr><td>上記以外</td><td>通常宙域。<b>どちらのモードでも安全</b></td></tr></tbody></table><div class="hint warn"><b>観測メモ：</b>シールドを使えば安全な区間でも、燃料が足りるとは限りません。「どこで防護航行が必要か」と「どこで通常航行に戻すか」を相談してください。</div></section>`}
function engineer(){app.innerHTML=header('機関担当')+`<section class="card"><h2>⚙️ 機関レポート｜燃料・エンジン</h2><div class="hint">燃料は<b>10ユニット</b>。補給はできません。各区間のモードを含めて燃料を計算してください。</div><div class="section"><h3>エンジンの共通ルール</h3><p><span class="tag">通常航行 N</span> 表に記載された基本燃料だけを消費します。</p><p><span class="tag">防護航行 P</span> シールド稼働のため、<b>基本燃料＋2</b>を消費します。</p><p><b class="accent">慣性回収ボーナス：</b>区間 <b>B→D</b> を通常航行した直後に、区間 <b>D→G</b> を防護航行すると、蓄積した慣性エネルギーをシールドに転用でき、<b>D→Gの消費燃料が−2</b>になります。</p><p class="small">※このボーナスは2区間が連続している場合のみ適用されます。</p></div><h3>基本燃料（モード補正前）</h3><div class="two"><table><thead><tr><th>区間</th><th>燃料</th></tr></thead><tbody><tr><td>S→A</td><td>3</td></tr><tr><td>S→B</td><td>2</td></tr><tr><td>A→C</td><td>3</td></tr><tr><td>A→D</td><td>2</td></tr><tr><td>B→D</td><td>2</td></tr><tr><td>B→E</td><td>3</td></tr><tr><td>C→F</td><td>3</td></tr><tr><td>C→D</td><td>2</td></tr></tbody></table><table><thead><tr><th>区間</th><th>燃料</th></tr></thead><tbody><tr><td>D→F</td><td>3</td></tr><tr><td>D→G</td><td>2</td></tr><tr><td>E→G</td><td>3</td></tr><tr><td>E→D</td><td>2</td></tr><tr><td>F→★</td><td>3</td></tr><tr><td>G→★</td><td>3</td></tr><tr><td>F→G</td><td>2</td></tr></tbody></table></div><div class="hint warn">燃料の少ない航路が安全とは限りません。観測担当にシールドが必要な区間を確認してください。</div></section>`}
function operator(){let s=load();app.innerHTML=header('航行担当')+`<section class="card"><div class="top"><h2>🧭 航行コンソール</h2><span class="pill" id="phase">開始待ち</span></div><div class="stats"><div class="stat"><small>経過時間</small><strong id="clock">00:00</strong></div><div class="stat"><small>現在スコア</small><strong id="score">100点</strong></div><div class="stat"><small>失敗した航行計画</small><strong id="errors">0回</strong></div></div><div class="tools"><button class="primary" id="begin">▶ タイマー開始・航路解放</button><button id="reset">新しいゲームを開始</button></div><div class="hint">各区間の<b>航行モード</b>を選んでから次の地点をクリックしてください。<b>安全性と燃料消費は専門家に確認</b>しましょう。航路の仮選択・変更は減点されません。</div><h3>航路マップ</h3><div id="map"></div><p class="small">S＝出発点／★＝帰還ゲート。線は接続関係のみを示します。危険度・燃料はマップに表示されません。</p><div class="section"><div class="mode"><label for="mode">次の区間の航行モード：</label><select id="mode"><option value="N">通常航行 N</option><option value="P">防護航行 P</option></select></div><p class="small">モードを選んだあと、マップ上の接続された次の地点をクリックしてください。</p></div><h3>計画中の航路とモード</h3><div class="route" id="route"></div><div class="tools"><button id="undo">↶ 1区間戻す</button><button id="clear">計画を最初から</button><button class="primary" id="commit">🚀 航行実行</button></div><div class="status" id="notice" role="status" aria-live="polite"></div><h3>航行ログ</h3><ol id="log"></ol></section>`;
const $=id=>document.getElementById(id);
function render(){let active=!!s.started&&!s.done;$('phase').textContent=s.done?'帰還成功':s.started?'航路計画中':'開始待ち';$('clock').textContent=s.started?fmt(elapsed(s)):'00:00';$('score').textContent=score(s)+'点';$('errors').textContent=s.errors+'回';$('begin').disabled=!!s.started;$('mode').disabled=!active;$('undo').disabled=!active||s.route.length<=1;$('clear').disabled=!active||s.route.length<=1;$('commit').disabled=!active||s.route.at(-1)!=='T';$('map').innerHTML=mapSvg(s.route,active);$('route').textContent=s.route.map((x,i)=>i===0?x:' —['+(s.modes[i-1]==='N'?'通常':'防護')+']→ '+(x==='T'?'★':x)).join('');$('notice').className='status '+(s.noticeType||'');$('notice').textContent=s.notice;$('log').replaceChildren(...s.history.map(x=>{let li=document.createElement('li');li.textContent=x;return li}));$('map').querySelectorAll('[data-node]').forEach(n=>{let go=()=>{if(!active)return;let id=n.dataset.node,last=s.route.at(-1);if(!edge(last,id)||s.route.includes(id))return;s.route.push(id);s.modes.push($('mode').value);s.notice='区間 '+last+'→'+id+' を'+($('mode').value==='N'?'通常':'防護')+'航行で追加しました。';s.noticeType='';save(s);render()};n.onclick=go;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function tick(){if(!s.started||s.done)return;$('clock').textContent=fmt(elapsed(s));$('score').textContent=score(s)+'点'}
// Keep one active interval for the entire operator view. Starting the timer does not rely on a reload.
const timer=setInterval(tick,250);
$('begin').onclick=()=>{if(s.started)return;s.started=Date.now();s.notice='タイマーが動き始めました。専門家と相談して航路とモードを選択してください。';save(s);render();tick()};
$('undo').onclick=()=>{if(s.route.length>1){s.route.pop();s.modes.pop();s.notice='最後の区間を取り消しました（減点なし）。';save(s);render()}};
$('clear').onclick=()=>{s.route=['S'];s.modes=[];s.notice='航路を最初から計画し直しました（減点なし）。タイマーは継続します。';save(s);render()};
$('commit').onclick=()=>{if(!s.started||s.done||s.route.at(-1)!=='T')return;let {fuel,unsafe}=evaluate(s.route,s.modes),label=s.route.map((x,i)=>i===0?x:'-'+s.modes[i-1]+'→'+x).join('');if(unsafe.length===0&&fuel<=10){s.done=true;s.ended=Date.now();s.notice=`帰還成功！ 航路 ${label}／燃料 ${fuel}/10／経過 ${fmt(elapsed(s))}／失敗 ${s.errors}回／最終スコア ${score(s)}点。`;s.noticeType='good';s.history.unshift('帰還成功：'+label+' ／ '+score(s)+'点')}else{s.errors++;s.notice='航行計画が成立しませんでした。安全条件または燃料条件に問題があります（詳細は非表示）。−15点。専門家と相談して再計画してください。';s.noticeType='bad';s.history.unshift('航行失敗：'+label+' ／ −15点');s.route=['S'];s.modes=[]}save(s);render()};
$('reset').onclick=()=>{if(!confirm('時間・得点・失敗履歴を初期化します。競技中は進行役の許可を得てください。よろしいですか？'))return;localStorage.removeItem(STORAGE);s=initial();$('mode').value='N';render()};
render()}
function host(){app.innerHTML=header('進行役専用')+`<section class="card"><h2>進行役用｜正解・ヒント</h2><div class="hint">唯一の成功計画：<b>S —通常→ B —通常→ D —防護→ G —通常→ ★</b>。燃料は<b>2 + 2 + (2 + 2 − 2) + 3 = 9/10</b>。D→Gはイオン嵐のため防護が必要ですが、B→Dを通常航行すると慣性回収で防護航行の追加燃料を相殺できます。</div><h3>段階的なヒント</h3><ol><li>航路だけでなく、各区間のモードもセットで考えてみましょう。</li><li>帰還ゲート直前ではシールドを解除する必要があります。</li><li>機関担当の「慣性回収ボーナス」がどの2区間で発生するか確認してください。</li><li>SからBに進み、Dを経由するルートを検討してみましょう。</li></ol><h3>スコアと時間</h3><p>100点 − 航行失敗×15点 − 開始2分30秒から30秒ごとに2点（計算式は開始2分を超える30秒区切り）。最低0点。成功時にタイマーと点数を固定します。</p><p class="small">役割別表示はURL切替であり、厳密なアクセス制御ではありません。操作履歴は航行担当のブラウザ内に保存され、別端末とは同期されません。</p></section>`}
if(role==='operator')operator();else if(role==='observer')observer();else if(role==='engineer')engineer();else if(role==='host')host();else start();
</script></body></html>
