<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ORION | 航行システムの復旧</title><style>
:root{color-scheme:dark;--bg:#0a1522;--panel:#172b3d;--line:#36546a;--txt:#edf5fb;--sub:#afc5d1;--aqua:#79ddd0;--red:#ffb3aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193a4f,var(--bg) 70%);font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:var(--txt)}main{max-width:1020px;margin:auto;padding:24px 16px 65px}h1{font-size:clamp(1.55rem,4vw,2.4rem);margin:7px 0}h2{font-size:1.18rem;margin:0 0 13px}h3{font-size:1rem;margin:16px 0 8px}p,li{color:var(--sub);line-height:1.75}.eyebrow{font-size:.77rem;letter-spacing:.16em;color:var(--aqua);font-weight:800}.card{background:#172b3ded;border:1px solid var(--line);border-radius:17px;padding:21px;margin:17px 0}.top,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nav{justify-content:flex-start;margin:14px 0}.pill{border:1px solid #5c8292;border-radius:30px;padding:7px 12px;font-size:.82rem}.roles,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{display:block;text-decoration:none;text-align:center;padding:22px 10px;background:#203b50;border:1px solid #56798d;border-radius:12px;color:var(--txt)}.role b{display:block;margin:9px 0}.role small,.muted{color:var(--sub)}button,.btn{font:inherit;background:#284c62;border:1px solid #648b9a;border-radius:10px;color:white;padding:11px 15px;cursor:pointer;text-decoration:none}button:hover:not(:disabled),.btn:hover{filter:brightness(1.17)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#7ad8cb;color:#08212a;font-weight:800;border:0}.stat{background:#203b50;border:1px solid #496b80;border-radius:12px;padding:13px}.stat small{color:var(--sub)}.stat strong{display:block;font-size:1.65rem;margin-top:5px}.map{background:#0e2032;border:1px solid #385a70;border-radius:15px;overflow:hidden}.map svg{display:block;width:100%;height:auto;max-height:430px}.edge{stroke:#6c91a8;stroke-width:3;stroke-dasharray:6 5;opacity:.8}.edge.active{stroke:#7ee4ce;stroke-width:5;stroke-dasharray:none;opacity:1}.node circle{fill:#26465c;stroke:#86afc2;stroke-width:2}.node text{fill:#eff9ff;font-size:15px;font-weight:800;pointer-events:none}.node{cursor:pointer}.node:focus{outline:none}.node:focus circle{stroke:#fff;stroke-width:4}.node.chosen circle{fill:#286b67;stroke:#9affdf;stroke-width:3}.node.next circle{stroke:#ffda87;stroke-width:3}.node.locked{cursor:default;opacity:.7}.hint{background:#213b50;border-left:4px solid var(--aqua);padding:12px 14px;border-radius:6px;line-height:1.8;margin:12px 0}.warn{border-left-color:#e9b16f}.bad{background:#553039;color:#ffe0dc}.good{background:#205344;color:#d7ffeb}.status{padding:14px;border-radius:11px;background:#203b50;line-height:1.7;margin-top:13px}.route{font-weight:800;letter-spacing:.06em;color:#a5f1de;min-height:28px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #39566b;text-align:left}th{color:#9ae5d7}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:.84rem;color:var(--sub)}.footer{margin-top:24px;font-size:.82rem;color:#9bb4c4}a{color:#9beadd}@media(max-width:650px){.roles,.stats,.two{grid-template-columns:1fr}.card{padding:16px}.map svg{max-height:none}}
</style></head><body><main><div class="top"><div><div class="eyebrow">ORION / MODULE 03</div><h1>航行システムの復旧</h1><p style="margin:0">危険宙域を突破し、帰還ゲートへ到達せよ。</p></div><span class="pill">3人協力・チーム対抗</span></div><div id="app"></div><p class="footer">役割別資料は各自の画面だけで確認してください。口頭での情報共有・質問・メモは自由です。</p></main><script>
'use strict';
const app=document.getElementById('app'),role=new URLSearchParams(location.search).get('role')||'start';
const EDGES=[['S','A',3,0],['S','B',2,0],['A','C',3,0],['A','D',2,1],['B','D',2,0],['B','E',3,0],['C','F',3,0],['C','D',2,1],['D','F',3,1],['D','G',2,0],['E','G',3,0],['E','D',2,1],['F','T',3,0],['G','T',3,0],['F','G',2,1]];
const POINTS={S:[42,177],A:[154,66],B:[154,292],C:[280,54],D:[280,177],E:[280,304],F:[408,82],G:[408,270],T:[530,177]};
const STORAGE='orion-module03-v1';
function url(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}
function fmt(ms){let sec=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function penalty(ms){return Math.max(0,Math.floor((ms-120000)/30000))*2}
function initial(){return {started:null,ended:null,route:['S'],errors:0,done:false,notice:'「タイマー開始」を押すと航路を選べます。',noticeType:'',history:[]}}
function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.route)&&s.route[0]==='S'&&typeof s.errors==='number')return s}catch(e){}return initial()}
function save(s){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}}
function elapsed(s){return (s.ended||Date.now())-(s.started||Date.now())}
function score(s){return Math.max(0,100-s.errors*15-penalty(elapsed(s)))}
function edge(a,b){return EDGES.find(e=>e[0]===a&&e[1]===b)}
function mapSvg(route,enabled){let segs=EDGES.map(([a,b])=>{let p=POINTS[a],q=POINTS[b],active=route.some((n,i)=>n===a&&route[i+1]===b);return `<line class="edge ${active?'active':''}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"></line>`}).join('');let nodes=Object.entries(POINTS).map(([id,p])=>{let chosen=route.includes(id),next=enabled&&!!edge(route[route.length-1],id)&&!chosen;return `<g class="node ${chosen?'chosen':''} ${next?'next':''} ${!enabled?'locked':''}" data-node="${id}" role="button" tabindex="${enabled?0:-1}" aria-label="地点${id}${next?'へ追加可能':''}"><circle cx="${p[0]}" cy="${p[1]}" r="20"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle">${id==='T'?'★':id}</text></g>`}).join('');return `<div class="map"><svg viewBox="0 0 575 355" role="img" aria-label="航行マップ。Sが出発点、星印が目的地。矢印の代わりに左から右へ進みます。">${segs}${nodes}</svg></div>`}
function header(name){return `<div class="nav"><a class="btn" href="${url('start')}">役割選択へ</a><span class="pill">${name}</span></div>`}
function start(){app.innerHTML=`<section class="card"><h2>担当する役割を選択</h2><p>3人がそれぞれ異なる情報を持ちます。航行担当はマップだけ、観測担当は危険情報だけ、機関担当は燃料情報だけを確認できます。</p><div class="roles"><a class="role" href="${url('operator')}"><span style="font-size:2rem">🧭</span><b>航行担当</b><small>航路の計画と実行</small></a><a class="role" href="${url('observer')}"><span style="font-size:2rem">📡</span><b>観測担当</b><small>危険宙域の情報</small></a><a class="role" href="${url('engineer')}"><span style="font-size:2rem">⛽</span><b>機関担当</b><small>燃料消費の情報</small></a></div></section><section class="card"><h2>ミッション</h2><p>出発地点Sから帰還ゲート★まで、<b>安全かつ燃料10以下</b>の航路を見つけてください。計画中は自由に変更できますが、「航行実行」で誤った計画を確定すると<b>−15点</b>。開始2分後から30秒ごとに<b>−2点</b>。時間減点の最初の発生は2分30秒です。</p><div class="hint">航行担当は他の2人に質問し、航路全体を決めてから実行してください。安全な航路でも燃料が足りなければ失敗です。</div></section><section class="card"><h2>役割別URL</h2>${[['operator','航行担当'],['observer','観測担当'],['engineer','機関担当']].map(([r,n])=>`<p><button data-copy="${r}">${n}のURLをコピー</button></p>`).join('')}<p class="small">進行役専用：<a href="${url('host')}">正解・ヒント画面</a>（参加者には送らない）</p></section>`;app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(url(b.dataset.copy));b.textContent='コピーしました'}catch(e){prompt('このURLをコピーしてください',url(b.dataset.copy))}})}
function observer(){app.innerHTML=header('観測担当')+`<section class="card"><h2>📡 観測レポート｜危険宙域</h2><p>航行マップは見えません。航行担当に地点と接続を確認しながら、安全性を伝えてください。</p><div class="hint">次の航路は<b>危険宙域</b>を通過するため、使用できません。その他の航路は安全です。</div><table><thead><tr><th>航路</th><th>危険理由</th></tr></thead><tbody><tr><td>A → D</td><td>高密度のデブリ帯</td></tr><tr><td>C → D</td><td>強い放射線</td></tr><tr><td>D → F</td><td>航行妨害電波</td></tr><tr><td>E → D</td><td>不安定な重力流</td></tr><tr><td>F → G</td><td>微小隕石群</td></tr></tbody></table><p class="small">重要：この資料には燃料消費量がありません。安全な航路が必ずしも到達可能とは限りません。</p></section>`}
function engineer(){app.innerHTML=header('機関担当')+`<section class="card"><h2>⛽ 機関レポート｜燃料計画</h2><div class="hint">出発時の燃料は<b>10ユニット</b>。航路ごとに下記の燃料を消費します。補給はできません。合計10以下で帰還ゲートへ到着してください。</div><p>危険宙域の情報はありません。観測担当と照合してください。</p><div class="two"><table><thead><tr><th>航路</th><th>燃料</th></tr></thead><tbody><tr><td>S → A</td><td>3</td></tr><tr><td>S → B</td><td>2</td></tr><tr><td>A → C</td><td>3</td></tr><tr><td>A → D</td><td>2</td></tr><tr><td>B → D</td><td>2</td></tr><tr><td>B → E</td><td>3</td></tr><tr><td>C → F</td><td>3</td></tr><tr><td>C → D</td><td>2</td></tr></tbody></table><table><thead><tr><th>航路</th><th>燃料</th></tr></thead><tbody><tr><td>D → F</td><td>3</td></tr><tr><td>D → G</td><td>2</td></tr><tr><td>E → G</td><td>3</td></tr><tr><td>E → D</td><td>2</td></tr><tr><td>F → T（★）</td><td>3</td></tr><tr><td>G → T（★）</td><td>3</td></tr><tr><td>F → G</td><td>2</td></tr></tbody></table></div><p class="small">燃料は航路ごとの固定値です。距離の見た目と燃料消費は一致しません。</p></section>`}
function operator(){let s=load(),interval;app.innerHTML=header('航行担当')+`<section class="card"><div class="top"><h2>🧭 航行コンソール</h2><span class="pill" id="phase">開始待ち</span></div><div class="stats"><div class="stat"><small>経過時間</small><strong id="clock">00:00</strong></div><div class="stat"><small>現在スコア</small><strong id="score">100点</strong></div><div class="stat"><small>失敗した航行計画</small><strong id="errors">0回</strong></div></div><div class="tools"><button class="primary" id="begin">▶ タイマー開始・航路解放</button><button id="reset">新しいゲームを開始</button></div><div class="hint">地点を選んで航路を計画します。計画の修正・1地点戻す操作は減点されません。<b>「航行実行」すると計画全体が検証されます。</b>失敗した実行は−15点です。</div><h3>航路マップ</h3><div id="map"></div><p class="small">S＝出発点／★＝帰還ゲート（機関資料ではT）。線で接続された次の地点だけ追加できます。線の色は危険度を示しません。</p><h3>計画中の航路</h3><div class="route" id="route"></div><div class="tools"><button id="undo">↶ 1地点戻す</button><button id="clear">計画を最初から</button><button class="primary" id="commit">🚀 航行実行</button></div><div class="status" id="notice" role="status" aria-live="polite"></div><h3>航行ログ</h3><ol id="log"></ol></section>`;
const $=id=>document.getElementById(id);
function render(){let active=!!s.started&&!s.done; $('phase').textContent=s.done?'復旧成功':s.started?'航行計画中':'開始待ち';$('clock').textContent=s.started?fmt(elapsed(s)):'00:00';$('score').textContent=score(s)+'点';$('errors').textContent=s.errors+'回';$('begin').disabled=!!s.started;$('undo').disabled=!active||s.route.length<=1;$('clear').disabled=!active||s.route.length<=1;$('commit').disabled=!active||s.route.at(-1)!=='T';$('map').innerHTML=mapSvg(s.route,active);$('route').textContent=s.route.map(x=>x==='T'?'★':x).join(' → ');$('notice').className='status '+(s.noticeType||'');$('notice').textContent=s.notice;$('log').innerHTML=s.history.map(x=>`<li>${x}</li>`).join('');$('map').querySelectorAll('[data-node]').forEach(n=>{let go=()=>{if(!active)return;let id=n.dataset.node,last=s.route.at(-1);if(!edge(last,id)||s.route.includes(id))return;s.route.push(id);s.notice='航路に地点'+(id==='T'?'★':id)+'を追加しました。出発前なら変更できます。';s.noticeType='';save(s);render()};n.onclick=go;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function tick(){if(s.started){$('clock').textContent=fmt(elapsed(s));$('score').textContent=score(s)+'点'}}
$('begin').onclick=()=>{if(s.started)return;s.started=Date.now();s.notice='タイマー開始。3人で安全性と燃料を確認し、航路を計画してください。';save(s);render()};
$('undo').onclick=()=>{if(s.route.length>1){s.route.pop();s.notice='最後の地点を取り消しました（減点なし）。';save(s);render()}};
$('clear').onclick=()=>{s.route=['S'];s.notice='航路の計画を最初からやり直しました（減点なし）。';save(s);render()};
$('commit').onclick=()=>{if(!s.started||s.done||s.route.at(-1)!=='T')return;let cost=0,unsafe=false;for(let i=0;i<s.route.length-1;i++){let e=edge(s.route[i],s.route[i+1]);if(!e)return;cost+=e[2];unsafe ||= !!e[3]}let label=s.route.join('→');if(!unsafe&&cost<=10){s.done=true;s.ended=Date.now();s.notice=`帰還成功！ 航路 ${label}／燃料 ${cost}/10／経過 ${fmt(elapsed(s))}／失敗 ${s.errors}回／最終スコア ${score(s)}点。`;s.noticeType='good';s.history.unshift('帰還成功：'+label+' ／ '+score(s)+'点');clearInterval(interval)}else{s.errors++;s.notice='航行計画が成立しませんでした。安全性または燃料条件に問題があります（詳細は非表示）。−15点。専門家と相談して再計画してください。';s.noticeType='bad';s.history.unshift('航行失敗：'+label+' ／ −15点');s.route=['S']}save(s);render()};
$('reset').onclick=()=>{if(!confirm('時間・得点・失敗履歴を初期化します。競技中は進行役の許可を得てください。よろしいですか？'))return;clearInterval(interval);localStorage.removeItem(STORAGE);operator()};
render();if(s.started&&!s.done)interval=setInterval(tick,250)}
function host(){app.innerHTML=header('進行役専用')+`<section class="card"><h2>進行役用｜正解・ヒント</h2><div class="hint">正解ルート：<b>S → B → D → G → T</b>（燃料<b>9/10</b>、危険区間なし）。他の安全ルートは燃料10を超えます。危険な近道は燃料が足りても不正解です。</div><h3>ヒント（必要に応じて段階的に）</h3><ol><li>最短距離ではなく「安全」と「燃料」の両方が必要です。</li><li>観測担当が危険区間を先に除外し、機関担当が残りの経路を計算すると整理できます。</li><li>SからAを通る安全ルートは燃料が足りません。SからBの経路を比較してみましょう。</li></ol><h3>スコア</h3><p>100点 − 失敗した航行実行×15点 − 開始2分後から30秒ごとに2点（最初の減点は2:30）。最低0点。航路編集中は減点なし。時間は航行成功時に停止します。</p><p class="small">注意：役割別画面はURLによる表示切替で、厳密なアクセス制御ではありません。ゲーム中は他の役割のURLを開かないルールで運用してください。各チームの操作はそれぞれのブラウザに保存され、他チームとは同期しません。</p></section>`}
if(role==='operator')operator();else if(role==='observer')observer();else if(role==='engineer')engineer();else if(role==='host')host();else start();
</script></body></html>
