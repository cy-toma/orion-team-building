<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ORION | 通信回路の復旧・改訂版</title>
<style>
:root{color-scheme:dark;--bg:#0a1522;--panel:#172b3d;--line:#36546a;--txt:#edf5fb;--sub:#afc5d1;--aqua:#79ddd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193a4f,var(--bg) 70%);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--txt)}.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:8px 0}h2{font-size:1.2rem;margin:0 0 12px}h3{font-size:1rem;margin:22px 0 9px}p,li{color:var(--sub);line-height:1.75}.eyebrow{font-size:.77rem;letter-spacing:.16em;color:var(--aqua);font-weight:800}.card{background:#172b3deb;border:1px solid var(--line);border-radius:17px;padding:22px;margin:17px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{border:1px solid #5c8292;border-radius:30px;padding:7px 12px;font-size:.8rem}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{display:block;text-decoration:none;text-align:center;padding:20px 10px;background:#203b50;border:1px solid #56798d;border-radius:12px;color:var(--txt)}.role:hover,.role:focus-visible{outline:2px solid var(--aqua)}.role b{display:block;margin:9px 0}.role small{color:var(--sub)}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.btn,button{font:inherit;background:#284c62;border:1px solid #648b9a;border-radius:10px;color:white;padding:11px 15px;cursor:pointer;text-decoration:none}button:hover,.btn:hover{filter:brightness(1.17)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#7ad8cb;color:#08212a;font-weight:800;border:0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{background:#203a4d;border:1px solid #3b5a6e;border-radius:11px;padding:13px}.fact span{display:block;font-size:.78rem;color:var(--sub)}.fact b{font-size:1.14rem}.wires{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:15px 0}.wire{background:#1d3548;border:2px solid #536d7f;border-radius:12px;min-height:123px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}.wire.selected{border-color:white;box-shadow:0 0 0 3px #6cd4c460}.symbol{font-size:2.1rem;font-weight:900}.red{color:#f77b82}.blue{color:#72b6ff}.yellow{color:#f8d477}.green{color:#83e1a4}.purple{color:#d4a2f5}.white{color:#f2f4f5}.entry{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.entry label{flex:1;min-width:170px;color:var(--sub);font-size:.9rem}input{display:block;width:100%;margin-top:8px;padding:12px;background:#102536;color:white;border:1px solid #6c91a3;border-radius:9px;font-size:1.2rem;letter-spacing:.15em}.status{background:#254353;border-radius:10px;padding:13px;margin-top:14px;min-height:50px}.status.ok{background:#195544;color:#c7ffe2}.status.bad{background:#61303a;color:#ffe1e4}.rule{background:#20394c;border-left:3px solid #7ad8cb;border-radius:4px;padding:13px 16px;margin:13px 0;line-height:1.8}.rule b{color:#fff}.rule ul{margin:4px 0;padding-left:22px}.rule li{color:#d6e6ed}.foot{font-size:.82rem;color:#9cb3c0}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid #466175;text-align:left;padding:10px}.table th{color:#9ce1d8}code{color:#b9e8e0;background:#284557;padding:2px 5px;border-radius:4px}@media(max-width:650px){.roles,.facts{grid-template-columns:1fr 1fr}.wires{grid-template-columns:repeat(2,1fr)}.card{padding:17px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">ORION / EMERGENCY SYSTEM</div><h1>通信回路の復旧</h1></div><span class="pill">MODULE 01 · 改訂版</span></header><p>宇宙船の通信が停止した。装置を操作できるのは1人だけ。残る2人は異なる専門資料を持っている。<strong style="color:#fff">互いの画面を見せず、会話だけで</strong>正しい回線と解除コードを見つけよう。</p><div id="app"></div><p class="foot">データ送信・ログイン不要。ゲームの判定とタイマーは各ブラウザ内で動作します。役割別URLはアクセス制限ではないため、各自の担当画面のみ閲覧してください。</p></main>
<script>
'use strict';
const app=document.querySelector('#app'), params=new URLSearchParams(location.search), role=params.get('role')||'start';
function url(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}
const back=`<nav class="nav"><a class="btn" href="${url('start')}">← 役割選択へ戻る</a></nav>`;
function copy(r,b){const v=url(r);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(()=>b.textContent='コピーしました').catch(()=>window.prompt('URLをコピーしてください',v))}else window.prompt('URLをコピーしてください',v)}
function start(){app.innerHTML=`<section class="card"><h2>担当する役割を選択</h2><p>3人がそれぞれ自分の役割の画面を開いてください。専門資料はほかの人に見せず、声で説明します。</p><div class="roles"><a class="role" href="${url('operator')}">🖥️<b>操作担当</b><small>装置の状態を見る・操作する</small></a><a class="role" href="${url('engineer')}">🔧<b>回路技師</b><small>配線の適合条件に詳しい</small></a><a class="role" href="${url('safety')}">🛡️<b>安全管理官</b><small>安全基準と解除認証に詳しい</small></a></div></section><section class="card"><h2>ミッション</h2><p>装置の6本の回線から<strong style="color:white">使用可能な回線を1本</strong>特定し、<strong style="color:white">3桁の解除コード</strong>を入力してください。どの情報から確認するかは自由です。</p><div class="rule">禁止：画面共有、資料画像の送信、他の役割のページを見ること。<br>OK：質問、口頭説明、メモ、相談、途中で考え直すこと。</div><p>目安：8〜10分。解除に成功したら、どの質問が役立ったか振り返ってみましょう。</p></section><section class="card"><h2>役割別URLを共有</h2><div class="nav"><button onclick="copy('operator',this)">操作担当URL</button><button onclick="copy('engineer',this)">回路技師URL</button><button onclick="copy('safety',this)">安全管理官URL</button></div><p class="foot">進行役専用の解答・ヒントは <a style="color:#9ce1d8" href="${url('host')}">こちら</a>。参加者には共有しないでください。</p></section>`}
function operator(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">OPERATOR / CONTROL PANEL</div><h2>通信回路の操作盤</h2><p>専門資料は持っていません。装置の状態を口頭で伝え、質問に答えてください。</p><div class="facts"><div class="fact"><span>バッテリー</span><b>2個</b></div><div class="fact"><span>識別番号</span><b>R-47</b></div><div class="fact"><span>警告灯</span><b style="color:#f8d477">橙色・点灯</b></div><div class="fact"><span>冷却装置</span><b style="color:#83e1a4">稼働中</b></div></div><h3>回線（左から1〜6番）</h3><div class="wires">${[['red','△','赤'],['blue','□','青'],['yellow','○','黄'],['green','△','緑'],['purple','□','紫'],['white','☆','白']].map(([color,mark,name],i)=>`<button class="wire" data-wire="${i+1}" aria-pressed="false"><span class="symbol ${color}">${mark}</span><b>${i+1}番・${name}</b></button>`).join('')}</div><div class="entry"><label>解除コード（3桁）<input id="code" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="例：123"></label><button class="primary" id="submit">解除を実行</button></div><div class="status" id="status" aria-live="polite">回線と解除コードを決めてください。</div><div class="nav"><button id="startClock">タイマー開始</button><button id="reset">やり直す</button><span class="pill" id="clock">経過 00:00</span><span class="pill" id="attempts">試行 0回</span></div></section>`;
let selected=0,attempts=0,started=null,interval=null,done=false;const status=document.querySelector('#status'),clock=document.querySelector('#clock');function tick(){if(started===null)return;const s=Math.floor((Date.now()-started)/1000);clock.textContent=`経過 ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function begin(){if(started!==null)return;started=Date.now();tick();interval=setInterval(tick,1000);document.querySelector('#startClock').disabled=true}
document.querySelector('#startClock').onclick=begin;document.querySelectorAll('[data-wire]').forEach(b=>b.onclick=()=>{if(done)return;selected=Number(b.dataset.wire);document.querySelectorAll('[data-wire]').forEach(w=>{w.classList.toggle('selected',w===b);w.setAttribute('aria-pressed',String(w===b))});status.className='status';status.textContent=`${selected}番の回線を選択中。`});document.querySelector('#submit').onclick=()=>{if(done)return;begin();const code=document.querySelector('#code').value.trim();if(!selected||!/^\d{3}$/.test(code)){status.className='status bad';status.textContent='回線を1本選び、3桁の数字を入力してください。';return}attempts++;document.querySelector('#attempts').textContent=`試行 ${attempts}回`;if(selected===4&&code==='138'){done=true;clearInterval(interval);tick();status.className='status ok';status.textContent=`復旧成功！ ${clock.textContent}、${attempts}回目の試行で解除しました。`;document.querySelector('#submit').disabled=true;document.querySelector('#code').disabled=true;document.querySelectorAll('[data-wire]').forEach(b=>b.disabled=true)}else{status.className='status bad';status.textContent='解除失敗。回線の適合条件・安全条件・コードの変換を相談し直してください。'}};document.querySelector('#reset').onclick=()=>{if(window.confirm('選択・タイマー・試行回数をリセットしますか？')){clearInterval(interval);operator()}}}
function engineer(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">CIRCUIT ENGINEER / TECHNICAL NOTE</div><h2>回路技師の技術メモ</h2><p>装置の状態は見えません。あなたが持っているのは回線の電気的な適合条件と、認証コードの変換仕様です。情報を聞き取り、ほかの人に説明してください。</p><h3>回線の適合条件</h3><div class="rule"><b>バッテリーの偶奇と端子形状</b><ul><li>バッテリーが偶数個なら、端子記号が<strong>△ または □</strong>の回線だけが通電する。</li><li>バッテリーが奇数個なら、端子記号が<strong>○ または ☆</strong>の回線だけが通電する。</li></ul></div><div class="rule"><b>識別番号と接続位置</b><ul><li>識別番号の数字部分が<strong>奇数</strong>なら、使用できるのは<strong>4〜6番</strong>の回線。</li><li>識別番号の数字部分が<strong>偶数</strong>なら、使用できるのは<strong>1〜3番</strong>の回線。</li></ul></div><h3>認証コードの変換仕様</h3><div class="rule">識別番号の<strong>末尾が7</strong>の場合、解除コードは<strong>右に1桁循環</strong>させる。<br>例：<code>123 → 312</code><br>末尾が7以外なら変換しない。</div><p>これらは電気的な適合条件です。安全面で使用できない回線が存在する可能性があります。</p></section>`}
function safety(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">SAFETY OFFICER / INSPECTION RECORD</div><h2>安全管理官の点検記録</h2><p>装置の状態は見えません。あなたが持っているのは使用禁止条件と、回線色ごとの認証コードです。</p><h3>回線の安全条件</h3><div class="rule"><b>警告灯</b><ul><li>警告灯が<strong>橙色に点灯</strong>しているとき、<strong>紫の回線は使用禁止</strong>。</li><li>警告灯が<strong>赤色に点灯</strong>しているとき、<strong>赤の回線は使用禁止</strong>。</li></ul></div><div class="rule"><b>冷却装置</b><ul><li>冷却装置が<strong>停止中</strong>なら、<strong>緑の回線は使用禁止</strong>。</li><li>冷却装置が<strong>稼働中</strong>なら、緑の回線は使用可能。ただし、ほかの条件も満たす必要がある。</li></ul></div><h3>認証コード台帳</h3><div class="rule"><p style="margin-top:0;color:#d6e6ed">最終的に選んだ回線の色に対応するコードを使用する。</p><table class="table"><thead><tr><th>色</th><th>基本コード</th><th>色</th><th>基本コード</th></tr></thead><tbody><tr><td>赤</td><td>814</td><td>緑</td><td>381</td></tr><tr><td>青</td><td>362</td><td>紫</td><td>657</td></tr><tr><td>黄</td><td>529</td><td>白</td><td>246</td></tr></tbody></table></div><p>この台帳は基本コードです。装置の識別番号によっては、入力前に変換が必要です。</p></section>`}
function host(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">FACILITATOR ONLY</div><h2>進行役：解答とヒント</h2><p>このページは参加者に見せないでください。</p><h3>一意解の確認</h3><div class="rule">装置の状態：バッテリー2個、識別番号R-47、警告灯は橙色点灯、冷却装置は稼働中。<br>回路技師の条件：バッテリー偶数なので<strong>△・□</strong>のみ → 1・2・4・5番。識別番号の数字部分47は奇数なので<strong>4〜6番</strong>のみ → 候補は<strong>4番（緑△）と5番（紫□）</strong>。<br>安全管理官の条件：橙色警告灯で紫は使用禁止 → <strong>4番（緑△）</strong>のみ。冷却装置稼働中なので緑は使用可能。<br>緑の基本コードは<strong>381</strong>。識別番号末尾7のため、右に1桁循環 → <strong>138</strong>。</div><h2>正解：4番（緑△）／138</h2><h3>時間別ヒント</h3><p><b>4分：</b>「使える回線は、電気的な条件と安全条件の両方を満たす必要があります」</p><p><b>7分：</b>「まず技師の条件で候補を絞り、安全管理官の禁止条件と照らし合わせてみてください」</p><h3>ファシリテーション</h3><p>最初に解く順番は指定しないでください。全員が自分の情報を一度は説明できたか、相手の話を確認する質問が生まれたかを観察します。</p><p class="foot">試遊での目標は5〜8分程度。難易度は実測して調整してください。現在の問題は固定問題のため、3チームが同時にプレイする想定です。</p></section>`}
if(role==='operator')operator();else if(role==='engineer')engineer();else if(role==='safety')safety();else if(role==='host')host();else start();
</script></body></html>
