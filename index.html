<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION | 通信回路の復旧</title><style>
:root{color-scheme:dark;font-family:system-ui,'Yu Gothic',sans-serif}*{box-sizing:border-box}body{background:radial-gradient(ellipse at top,#1b3d53,#0b1521 75%);color:#edf7ff;margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 70px}h1{font-size:clamp(25px,4vw,38px)}h2{font-size:21px}p,li{line-height:1.85;color:#b9cedc}.kicker{color:#83e1d3;letter-spacing:.16em;font-size:12px;font-weight:800}.card{background:#162b3d;border:1px solid #365268;border-radius:17px;padding:23px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wires{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.role,.wire{background:#213c50;border:1px solid #57768b;border-radius:12px;color:white;padding:19px 10px;text-align:center;cursor:pointer;font:inherit}.role{display:block;text-decoration:none}.role strong,.role small{display:block;margin:8px}.role small{color:#bbd1df}.wire{min-height:132px}.wire.selected{border:3px solid #7bddd0;background:#30516a}.symbol{font-size:40px;display:block}.red{color:#ff8080}.blue{color:#83b8ff}.yellow{color:#f7d773}.green{color:#80e5a8}.datum{background:#203d51;border-radius:10px;padding:13px}.datum span{display:block;color:#b9d0db;font-size:13px}.datum strong{font-size:22px}.rule{border-left:4px solid #75d8c7;background:#203c50;padding:15px;margin:14px 0;line-height:1.9}.rule b{color:#fff}.step{color:#91e6d9;font-size:13px;font-weight:800}button,.btn{border:1px solid #6d99a7;background:#244b60;color:white;border-radius:10px;padding:12px 15px;cursor:pointer;font:inherit}.btn{display:inline-block;text-decoration:none}.primary{background:#78d6c8;color:#0b2830;font-weight:800;border:0}button:disabled{opacity:.5;cursor:not-allowed}input{background:#0e2434;color:white;border:1px solid #63869a;border-radius:9px;padding:13px;font:inherit;font-size:21px;max-width:210px;width:100%}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.status{background:#264455;padding:15px;border-radius:11px;line-height:1.6}.success{background:#185242;color:#bbf7d9}.error{background:#66303c;color:#ffdde2}.tag{border:1px solid #66849a;border-radius:30px;padding:8px 12px;font-size:13px}.muted{color:#a5bdcc;font-size:13px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #456175;padding:10px;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr}.wires{grid-template-columns:repeat(2,1fr)}.card{padding:17px}}
</style></head><body><main class="wrap"><div class="kicker">ORION / EMERGENCY SYSTEM</div><h1>通信回路の復旧</h1><p>宇宙船の通信が停止した。操作担当と2人の管制官が、それぞれ異なる情報を持っている。<b>資料を見せず、会話だけで</b>正しい回線と解除コードを突き止めよう。</p><div id="app"></div><p class="muted">端末内で動く無料のゲームです。役割別URLは閲覧を技術的に制限するものではありません。互いの画面を見ないルールで遊んでください。</p></main><script>
const app=document.querySelector('#app'),role=new URLSearchParams(location.search).get('role')||'start';function link(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}const back=`<p><a class="btn" href="${link('start')}">役割選択に戻る</a></p>`;
function copy(r,b){navigator.clipboard.writeText(link(r)).then(()=>b.textContent='コピーしました').catch(()=>prompt('URLをコピーしてください',link(r)))}
function home(){app.innerHTML=`<section class="card"><h2>3人の役割</h2><div class="grid"><a class="role" href="${link('operator')}">🖥️<strong>操作担当</strong><small>装置を見て操作する</small></a><a class="role" href="${link('a')}">📘<strong>管制官A</strong><small>回線選択の規則を持つ</small></a><a class="role" href="${link('b')}">📗<strong>管制官B</strong><small>補正とコードの規則を持つ</small></a></div></section><section class="card"><h2>ルール</h2><p>①3人で通話する。②各自の役割を開く。③操作担当がタイマーを開始。④口頭で情報を交換。⑤操作担当が回線とコードを入力して解除する。</p><div class="rule">禁止：画面共有、スクリーンショット送信、他人の役割の閲覧。<br>OK：口頭説明、質問、聞いた内容のメモ、相談。</div><p>制限時間の目安：10分。失敗しても再挑戦できます。</p><h2>役割別URLを送る</h2>${[['operator','操作担当'],['a','管制官A'],['b','管制官B']].map(([r,n])=>`<p><button onclick="copy('${r}',this)">${n}のURLをコピー</button></p>`).join('')}<p class="muted">進行役専用：<a style="color:#9ce5d9" href="${link('host')}">正解とヒント</a>（参加者には送らない）</p></section>`}
function operator(){app.innerHTML=back+`<section class="card"><div class="kicker">OPERATOR ONLY</div><h2>通信回路 操作パネル</h2><p>マニュアルは見られません。ほかの2人に装置の状態を説明し、指示を受けて操作してください。</p><div class="grid"><div class="datum"><span>バッテリー</span><strong>2個</strong></div><div class="datum"><span>識別番号</span><strong>R-47</strong></div><div class="datum"><span>警告灯</span><strong style="color:#f7d773">橙色・点灯</strong></div></div><h2>回線（左から1〜4番）</h2><div class="wires">${[['△','赤','red'],['○','青','blue'],['□','黄','yellow'],['☆','緑','green']].map(([s,n,c],i)=>`<button class="wire" data-n="${i+1}" aria-pressed="false"><span class="symbol ${c}">${s}</span>${i+1}番・${n}</button>`).join('')}</div><div class="bar"><label>解除コード（3桁）<br><input id="code" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000"></label><button class="primary" id="submit">解除を実行</button></div><div class="status" id="feedback" aria-live="polite">回線とコードを入力してください。</div><div class="bar"><button id="begin">タイマー開始</button><button id="reset">リセット</button><span class="tag" id="clock">経過 00:00</span><span class="tag" id="attempts">試行 0回</span></div></section>`;
let selected=0,tries=0,started=null,done=false,timer;const feedback=document.querySelector('#feedback'),clock=document.querySelector('#clock');function tick(){if(started===null)return;let s=Math.floor((Date.now()-started)/1000);clock.textContent=`経過 ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function begin(){if(started!==null)return;started=Date.now();timer=setInterval(tick,1000);document.querySelector('#begin').disabled=true}
document.querySelector('#begin').onclick=begin;document.querySelectorAll('.wire').forEach(b=>b.onclick=()=>{if(done)return;selected=Number(b.dataset.n);document.querySelectorAll('.wire').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});feedback.className='status';feedback.textContent=`${selected}番を選択中`});document.querySelector('#submit').onclick=()=>{if(done)return;let code=document.querySelector('#code').value.trim();if(!selected||!/^\d{3}$/.test(code)){feedback.className='status error';feedback.textContent='回線を選び、3桁の数字を入力してください。';return}begin();tries++;document.querySelector('#attempts').textContent=`試行 ${tries}回`;if(selected===3&&code==='925'){done=true;clearInterval(timer);tick();feedback.className='status success';feedback.textContent=`通信回路の復旧に成功！ ${clock.textContent}、${tries}回目で解除。`;document.querySelector('#submit').disabled=true;document.querySelector('#code').disabled=true;document.querySelectorAll('.wire').forEach(x=>x.disabled=true)}else{feedback.className='status error';feedback.textContent='解除失敗。管制官と回線の補正やコード変換を確認してください。'}};document.querySelector('#reset').onclick=()=>{if(confirm('タイマーと試行回数をリセットしますか？')){clearInterval(timer);operator()}}}
function a(){app.innerHTML=back+`<section class="card"><div class="kicker">CONTROL A / PRIVATE</div><h2>管制官A：回線選択マニュアル</h2><p>操作パネルは見えません。操作担当に質問し、管制官Bと相談してください。</p><div class="rule"><span class="step">STEP 1：基本回線</span><br>バッテリー数が<b>偶数</b>なら「☆」の回線。<br><b>奇数</b>なら「○」の回線を選ぶ。</div><div class="rule"><span class="step">STEP 2：識別番号の補正</span><br>識別番号の末尾が<b>7</b>なら回線番号を<b>1つ小さく</b>する。それ以外は変更しない。<br>※1番の前は4番。</div><div class="rule"><span class="step">STEP 3：Bに確認</span><br>現在選んでいる回線の<b>番号・色・記号</b>を管制官Bに伝える。<br>Bが持つ警告灯の補正規則を適用してもらい、<b>補正後の番号・色・記号</b>を聞く。</div><div class="rule"><span class="step">STEP 4：最終安全確認</span><br>Bの補正後の回線が<b>青色</b>で、バッテリーが<b>偶数</b>なら、番号を<b>1つ大きく</b>する。それ以外は変更しない。<br>※4番の次は1番。</div><p>最終的な回線番号・色・記号をBに返し、解除コードを確認してもらう。</p></section>`}
function b(){app.innerHTML=back+`<section class="card"><div class="kicker">CONTROL B / PRIVATE</div><h2>管制官B：補正・解除コードマニュアル</h2><p>操作パネルは見えません。操作担当とAに必要な情報を聞き取ってください。</p><div class="rule"><span class="step">STEP 1：警告灯による補正</span><br>警告灯が<b>橙色に点灯</b>し、Aが選んだ回線の記号が<b>□</b>なら、回線番号を<b>1つ小さく</b>する。それ以外は変更しない。<br>※1番の前は4番。<br><b>補正後の番号・色・記号をAに返し、Aの最終安全確認を受けること。</b></div><div class="rule"><span class="step">STEP 2：最終回線の基本コード</span><table><tr><th>色</th><th>コード</th></tr><tr><td>赤</td><td>814</td></tr><tr><td>青</td><td>362</td></tr><tr><td>黄</td><td>529</td></tr><tr><td>緑</td><td>173</td></tr></table></div><div class="rule"><span class="step">STEP 3：コード変換</span><br>識別番号の数字部分が<b>40以上</b>なら、基本コードの<b>最初と最後の数字を入れ替える</b>。39以下なら変更しない。</div><p>最終的な回線番号と3桁のコードを操作担当に伝える。</p></section>`}
function host(){app.innerHTML=back+`<section class="card"><div class="kicker">FACILITATOR ONLY</div><h2>正解：3番（黄□）／925</h2><div class="rule">①バッテリー2個（偶数）→ Aは☆＝4番を選択。<br>②識別番号R-47の末尾7 → 1つ戻して3番（黄□）。<br>③橙色の警告灯が点灯、□の回線 → Bが1つ戻して2番（青○）。<br>④青色かつバッテリー偶数 → Aが1つ進めて3番（黄□）。<br>⑤黄の基本コード529、識別番号47は40以上 → 最初と最後を交換して<b>925</b>。</div><h2>ヒント</h2><p>4分後：「Bが補正した結果をAに戻して、安全確認していますか？」</p><p>7分後：「Bが選び直した回線が青色なら、Aのマニュアルをもう一度確認してください」</p><h2>試遊で見ること</h2><p>全員が発言したか／質問が双方向に起きたか／説明がわかりやすかったか／8〜10分以内に解けるか。</p></section>`}
if(role==='operator')operator();else if(role==='a')a();else if(role==='b')b();else if(role==='host')host();else home();
</script></body></html>
