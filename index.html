<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ORION | 通信回路の復旧 v2</title>
<style>
:root{color-scheme:dark;--bg:#0a1522;--panel:#172b3d;--line:#36546a;--txt:#edf5fb;--sub:#afc5d1;--aqua:#79ddd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193a4f,var(--bg) 70%);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--txt)}.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:8px 0}h2{font-size:1.2rem;margin:0 0 12px}h3{font-size:1rem;margin:22px 0 9px}p,li{color:var(--sub);line-height:1.75}.eyebrow{font-size:.77rem;letter-spacing:.16em;color:var(--aqua);font-weight:800}.card{background:#172b3deb;border:1px solid var(--line);border-radius:17px;padding:22px;margin:17px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{border:1px solid #5c8292;border-radius:30px;padding:7px 12px;font-size:.8rem}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{display:block;text-decoration:none;text-align:center;padding:20px 10px;background:#203b50;border:1px solid #56798d;border-radius:12px;color:var(--txt)}.role:hover,.role:focus-visible{outline:2px solid var(--aqua)}.role b{display:block;margin:9px 0}.role small{color:var(--sub)}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.btn,button{font:inherit;background:#284c62;border:1px solid #648b9a;border-radius:10px;color:white;padding:11px 15px;cursor:pointer;text-decoration:none}button:hover,.btn:hover{filter:brightness(1.17)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#7ad8cb;color:#08212a;font-weight:800;border:0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{background:#203a4d;border:1px solid #3b5a6e;border-radius:11px;padding:13px}.fact span{display:block;font-size:.78rem;color:var(--sub)}.fact b{font-size:1.14rem}.wires{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:15px 0}.wire{background:#1d3548;border:2px solid #536d7f;border-radius:12px;min-height:123px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}.wire.selected{border-color:white;box-shadow:0 0 0 3px #6cd4c460}.symbol{font-size:2.1rem;font-weight:900}.red{color:#f77b82}.blue{color:#72b6ff}.yellow{color:#f8d477}.green{color:#83e1a4}.purple{color:#d4a2f5}.white{color:#f2f4f5}.entry{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.entry label{flex:1;min-width:170px;color:var(--sub);font-size:.9rem}input{display:block;width:100%;margin-top:8px;padding:12px;background:#102536;color:white;border:1px solid #6c91a3;border-radius:9px;font-size:1.2rem;letter-spacing:.15em}.status{background:#254353;border-radius:10px;padding:13px;margin-top:14px;min-height:50px}.status.ok{background:#195544;color:#c7ffe2}.status.bad{background:#61303a;color:#ffe1e4}.rule{background:#20394c;border-left:3px solid #7ad8cb;border-radius:4px;padding:13px 16px;margin:13px 0;line-height:1.8}.rule b{color:#fff}.rule ul{margin:4px 0;padding-left:22px}.rule li{color:#d6e6ed}.foot{font-size:.82rem;color:#9cb3c0}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid #466175;text-align:left;padding:10px}.table th{color:#9ce1d8}code{color:#b9e8e0;background:#284557;padding:2px 5px;border-radius:4px}@media(max-width:650px){.roles,.facts{grid-template-columns:1fr 1fr}.wires{grid-template-columns:repeat(2,1fr)}.card{padding:17px}}
 .score{border-color:#6cd4c4;background:#155249;color:#d5fff3;font-weight:800}.wire:disabled{opacity:.55}.status strong{color:inherit}.mini{font-size:.84rem;color:var(--sub)}.scoregrid{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.result{border:1px solid #75dfb5;background:#144e41;border-radius:12px;padding:16px;margin-top:14px}.result h3{margin:0 0 7px;color:#b9ffe4} </style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">ORION / EMERGENCY SYSTEM</div><h1>通信回路の復旧</h1></div><span class="pill">MODULE 01 · v2 / SCORE</span></header><p>宇宙船の通信が停止した。装置を操作できるのは1人だけ。残る2人は異なる専門資料を持っている。<strong style="color:#fff">互いの画面を見せず、会話だけで</strong>正しい回線と解除コードを見つけよう。開始前は操作盤がロックされ、解除実行を間違えると減点される。</p><div id="app"></div><p class="foot">データ送信・ログイン不要。ゲームの判定とタイマーは各ブラウザ内で動作します。役割別URLはアクセス制限ではないため、各自の担当画面のみ閲覧してください。</p></main>
<script>
'use strict';
const app=document.querySelector('#app'), params=new URLSearchParams(location.search), role=params.get('role')||'start';
function url(r){const u=new URL(location.href);u.searchParams.set('role',r);return u.href}
const back=`<nav class="nav"><a class="btn" href="${url('start')}">← 役割選択へ戻る</a></nav>`;
function copy(r,b){const v=url(r);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(()=>b.textContent='コピーしました').catch(()=>window.prompt('URLをコピーしてください',v))}else window.prompt('URLをコピーしてください',v)}
function start(){app.innerHTML=`<section class="card"><h2>担当する役割を選択</h2><p>3人がそれぞれ自分の役割の画面を開いてください。専門資料はほかの人に見せず、声で説明します。</p><div class="roles"><a class="role" href="${url('operator')}">🖥️<b>操作担当</b><small>装置の状態を見る・操作する</small></a><a class="role" href="${url('engineer')}">🔧<b>回路技師</b><small>配線の適合条件に詳しい</small></a><a class="role" href="${url('safety')}">🛡️<b>安全管理官</b><small>安全基準と解除認証に詳しい</small></a></div></section><section class="card"><h2>ミッション</h2><p>装置の6本の回線から<strong style="color:white">使用可能な回線を1本</strong>特定し、<strong style="color:white">3桁の解除コード</strong>を入力してください。どの情報から確認するかは自由です。</p><div class="rule">禁止：画面共有、資料画像の送信、他の役割のページを見ること。<br>OK：質問、口頭説明、メモ、相談、途中で考え直すこと。</div><p>目安：5〜8分。誤った解除実行は−15点、開始2分後から30秒ごとに−2点。解除に成功したら、どの質問が役立ったか振り返ってみましょう。</p></section><section class="card"><h2>役割別URLを共有</h2><div class="nav"><button onclick="copy('operator',this)">操作担当URL</button><button onclick="copy('engineer',this)">回路技師URL</button><button onclick="copy('safety',this)">安全管理官URL</button></div><p class="foot">進行役専用の解答・ヒントは <a style="color:#9ce1d8" href="${url('host')}">こちら</a>。参加者には共有しないでください。</p></section>`}
function operator(){
app.innerHTML=`${back}<section class="card"><div class="eyebrow">OPERATOR / CONTROL PANEL</div><h2>通信回路の操作盤</h2><p>装置の状態を専門家へ説明してください。<strong style="color:white">タイマー開始前は選択・入力・解除実行ができません。</strong></p><div class="facts"><div class="fact"><span>バッテリー</span><b>2個</b></div><div class="fact"><span>識別番号</span><b>R-47</b></div><div class="fact"><span>警告灯の色</span><b style="color:#f8d477">橙色・点灯</b></div><div class="fact"><span>冷却装置</span><b style="color:#83e1a4">稼働中</b></div></div><h3>回線（1〜6番）</h3><div class="wires">${[['red','△','赤'],['blue','□','青'],['yellow','○','黄'],['green','△','緑'],['purple','□','紫'],['white','☆','白']].map(([color,mark,name],i)=>`<button class="wire" data-wire="${i+1}" aria-pressed="false" disabled><span class="symbol ${color}">${mark}</span><b>${i+1}番・${name}</b><small>端子：${mark}</small></button>`).join('')}</div><div class="entry"><label>解除コード（3桁）<input id="code" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="例：123" disabled></label><button class="primary" id="submit" disabled>解除を実行</button></div><div class="status" id="status" aria-live="polite">待機中。「タイマー開始」を押すと操作できます。</div><div class="scoregrid"><span class="pill score" id="score">スコア 100点</span><span class="pill" id="clock">経過 00:00</span><span class="pill" id="timePenalty">時間減点 0点</span><span class="pill" id="attempts">誤操作 0回</span></div><div class="nav"><button class="primary" id="startClock">▶ タイマー開始・操作解放</button><button id="reset">新しいゲームを開始</button></div><p class="mini">100点から開始。誤った回線・コードで解除を実行するたび−15点。開始後2分間は時間減点なし、2分30秒時点から30秒ごとに−2点。最低0点。解除成功時にスコアを確定します。</p><div id="result"></div></section>`;
const key='orion-module01-v2';const fresh=()=>({selected:0,code:'',errors:0,started:null,ended:null,done:false});let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(key)||'{}'))}catch(_){s=fresh()}let interval=null;
const el=id=>document.getElementById(id);const persist=()=>{try{localStorage.setItem(key,JSON.stringify(s))}catch(_){}};
function elapsed(){return s.started===null?0:Math.max(0,Math.floor(((s.ended===null?Date.now():s.ended)-s.started)/1000))}
function timePenalty(){return Math.max(0,Math.floor((elapsed()-120)/30))*2}
function score(){return Math.max(0,100-s.errors*15-timePenalty())}
function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function tick(){el('clock').textContent=`経過 ${fmt(elapsed())}`;el('timePenalty').textContent=`時間減点 -${timePenalty()}点`;el('score').textContent=`スコア ${score()}点`}
function render(){const unlocked=s.started!==null&&!s.done;el('startClock').disabled=s.started!==null;el('code').disabled=!unlocked;el('submit').disabled=!unlocked;el('code').value=s.code;el('attempts').textContent=`誤操作 ${s.errors}回`;document.querySelectorAll('[data-wire]').forEach(b=>{b.disabled=!unlocked;b.classList.toggle('selected',Number(b.dataset.wire)===s.selected);b.setAttribute('aria-pressed',String(Number(b.dataset.wire)===s.selected))});if(s.done){el('status').className='status ok';el('status').textContent='通信回路の復旧に成功しました！';el('result').innerHTML=`<div class="result"><h3>復旧成功！</h3><p style="color:#d7ffef">最終スコア <strong>${score()}点</strong> ／ クリア時間 <strong>${fmt(elapsed())}</strong> ／ 誤操作 <strong>${s.errors}回</strong></p><p class="mini">この結果を進行役に報告してください。</p></div>`}else if(s.started===null){el('status').className='status';el('status').textContent='待機中。「タイマー開始」を押すと操作できます。'}tick()}
function begin(){if(s.started!==null)return;s.started=Date.now();persist();render();interval=setInterval(tick,1000);el('status').textContent='操作解放。3人で回線とコードを相談してください。'}
el('startClock').onclick=begin;document.querySelectorAll('[data-wire]').forEach(b=>b.onclick=()=>{if(s.started===null||s.done)return;s.selected=Number(b.dataset.wire);persist();render();el('status').className='status';el('status').textContent=`${s.selected}番を選択中。解除を実行する前に確認してください。`});el('code').oninput=e=>{s.code=e.target.value.replace(/[^0-9]/g,'').slice(0,3);if(e.target.value!==s.code)e.target.value=s.code;persist()};el('submit').onclick=()=>{if(s.started===null||s.done)return;if(!s.selected||!/^[0-9]{3}$/.test(s.code)){el('status').className='status bad';el('status').textContent='回線を選び、3桁のコードを入力してください（未入力では減点されません）。';return}if(s.selected===4&&s.code==='138'){s.done=true;s.ended=Date.now();persist();clearInterval(interval);render()}else{s.errors++;persist();render();el('status').className='status bad';el('status').textContent=`解除失敗：−15点（現在${score()}点）。回線・端子・警告灯の条件とコード変換を再確認してください。`}};el('reset').onclick=()=>{if(confirm('新しいゲームを開始しますか？ タイマーとスコアが初期化されます。チーム対抗戦では進行役の許可を得てください。')){clearInterval(interval);s=fresh();persist();operator()}};render();if(s.started!==null&&!s.done)interval=setInterval(tick,1000)
}
function engineer(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">CIRCUIT ENGINEER / TECHNICAL NOTE</div><h2>回路技師の技術メモ</h2><p>装置の状態は見えません。あなたが持っているのは回線の電気的な適合条件と、認証コードの変換仕様です。端子の記号と配線の色を混同しないよう、操作担当に確認してください。情報を聞き取り、ほかの人に説明してください。</p><h3>回線の適合条件</h3><div class="rule"><b>バッテリーの偶奇と端子形状</b><ul><li>バッテリーが偶数個なら、端子記号が<strong>△ または □</strong>の回線だけが通電する。</li><li>バッテリーが奇数個なら、端子記号が<strong>○ または ☆</strong>の回線だけが通電する。</li></ul></div><div class="rule"><b>識別番号と接続位置</b><ul><li>識別番号の数字部分が<strong>奇数</strong>なら、使用できるのは<strong>4〜6番</strong>の回線。</li><li>識別番号の数字部分が<strong>偶数</strong>なら、使用できるのは<strong>1〜3番</strong>の回線。</li></ul></div><h3>認証コードの変換仕様</h3><div class="rule">識別番号の<strong>末尾が7</strong>の場合、解除コードは<strong>右に1桁循環</strong>させる。<br>例：<code>123 → 312</code><br>末尾が7以外なら変換しない。</div><p>これらは電気的な適合条件です。安全面で使用できない回線が存在する可能性があります。</p></section>`}
function safety(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">SAFETY OFFICER / INSPECTION RECORD</div><h2>安全管理官の点検記録</h2><p>装置の状態は見えません。あなたが持っているのは使用禁止条件と、回線色ごとの認証コードです。警告灯の色と配線の色は異なる情報なので、どちらの話か確認してください。</p><h3>回線の安全条件</h3><div class="rule"><b>警告灯</b><ul><li>警告灯が<strong>橙色に点灯</strong>しているとき、<strong>紫の回線は使用禁止</strong>。</li><li>警告灯が<strong>赤色に点灯</strong>しているとき、<strong>赤の回線は使用禁止</strong>。</li></ul></div><div class="rule"><b>冷却装置</b><ul><li>冷却装置が<strong>停止中</strong>なら、<strong>緑の回線は使用禁止</strong>。</li><li>冷却装置が<strong>稼働中</strong>なら、緑の回線は使用可能。ただし、ほかの条件も満たす必要がある。</li></ul></div><h3>認証コード台帳</h3><div class="rule"><p style="margin-top:0;color:#d6e6ed">最終的に選んだ回線の色に対応するコードを使用する。</p><table class="table"><thead><tr><th>色</th><th>基本コード</th><th>色</th><th>基本コード</th></tr></thead><tbody><tr><td>赤</td><td>814</td><td>緑</td><td>381</td></tr><tr><td>青</td><td>362</td><td>紫</td><td>657</td></tr><tr><td>黄</td><td>529</td><td>白</td><td>246</td></tr></tbody></table></div><p>この台帳は基本コードです。装置の識別番号によっては、入力前に変換が必要です。</p></section>`}
function host(){app.innerHTML=`${back}<section class="card"><div class="eyebrow">FACILITATOR ONLY</div><h2>進行役：解答とヒント</h2><p>このページは参加者に見せないでください。</p><h3>一意解の確認</h3><div class="rule">装置の状態：バッテリー2個、識別番号R-47、警告灯は橙色点灯、冷却装置は稼働中。<br>回路技師の条件：バッテリー偶数なので<strong>△・□</strong>のみ → 1・2・4・5番。識別番号の数字部分47は奇数なので<strong>4〜6番</strong>のみ → 候補は<strong>4番（緑△）と5番（紫□）</strong>。<br>安全管理官の条件：橙色警告灯で紫は使用禁止 → <strong>4番（緑△）</strong>のみ。冷却装置稼働中なので緑は使用可能。<br>緑の基本コードは<strong>381</strong>。識別番号末尾7のため、右に1桁循環 → <strong>138</strong>。</div><h2>正解：4番（緑△）／138</h2><h3>時間別ヒント</h3><p><b>4分：</b>「使える回線は、電気的な条件と安全条件の両方を満たす必要があります」</p><p><b>7分：</b>「まず技師の条件で候補を絞り、安全管理官の禁止条件と照らし合わせてみてください」</p><h3>ファシリテーション</h3><p>最初に解く順番は指定しないでください。全員が自分の情報を一度は説明できたか、相手の話を確認する質問が生まれたかを観察します。</p><p class="foot">スコア：100−誤操作×15−時間減点。時間減点は開始2分30秒から30秒ごとに2点。タイマー開始必須。試遊での目標は5〜8分程度。難易度は実測して調整してください。現在の問題は固定問題のため、3チームが同時にプレイする想定です。</p></section>`}
if(role==='operator')operator();else if(role==='engineer')engineer();else if(role==='safety')safety();else if(role==='host')host();else start();
</script></body></html>
